<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NegxusTube</title>
<style>
:root{--bg:#0f0f0f;--bg2:#181818;--bg3:#272727;--bg4:#3a3a3a;--text:#f1f1f1;--text2:#aaa;--red:#f03;--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Roboto,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
a{color:#3ea6ff;text-decoration:none}
.header{position:fixed;top:0;left:0;right:0;height:58px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:200;gap:8px}
.hl,.hr{display:flex;align-items:center;gap:6px}
.ib{width:40px;height:40px;border:none;background:none;color:var(--text);border-radius:50%;font-size:18px}.ib:hover{background:var(--bg3)}
.logo{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px;font-weight:700;font-size:19px;letter-spacing:-.5px}
.logo i{background:var(--red);width:32px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-style:normal}
.logo b{color:var(--red);font-weight:900}
.hc{flex:1;max-width:640px;position:relative}
.sb{display:flex}
.sb input{flex:1;min-width:0;height:40px;background:var(--bg);border:1px solid #303030;border-radius:20px 0 0 20px;padding:0 16px;color:var(--text);font-size:15px;outline:none}
.sb input:focus{border-color:#3ea6ff}
.sb button{width:60px;height:40px;background:var(--bg3);border:1px solid #303030;border-radius:0 20px 20px 0;color:var(--text)}
.sug{position:absolute;top:44px;left:0;right:60px;background:var(--bg2);border-radius:var(--r);padding:8px 0;display:none;box-shadow:0 4px 30px #000a}
.sug div{padding:8px 16px;cursor:pointer;font-size:14px}.sug div:hover{background:var(--bg3)}
.layout{display:flex;padding-top:58px}
.side{width:220px;flex-shrink:0;height:calc(100vh - 58px);overflow-y:auto;padding:10px;position:sticky;top:58px}
.side.col{width:72px}.side.col .lb{display:none}.side.col .si{justify-content:center;padding:14px 0}
.si{display:flex;align-items:center;gap:20px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.si:hover,.si.on{background:var(--bg3)}.si .ic{width:24px;text-align:center}
.sep{border-top:1px solid #ffffff14;margin:8px 0}
.main{flex:1;padding:18px 26px;min-width:0}
h2.t{font-size:18px;margin:6px 0 16px}
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{padding:7px 14px;background:var(--bg3);border:none;border-radius:8px;color:var(--text);font-size:14px}.chip.on{background:var(--text);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px 16px}
.card{cursor:pointer}
.th{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--bg3)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:#000c;padding:2px 5px;border-radius:4px;font-size:12px;font-weight:500}
.vm{display:flex;gap:12px;padding-top:10px}
.av{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--bg4);object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700}
.vt{font-size:15px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc{font-size:13px;color:var(--text2);margin-top:3px}.vc a{color:var(--text2)}.vc a:hover{color:var(--text)}
.row{display:flex;gap:16px;margin-bottom:14px;cursor:pointer}.row .th{width:360px;max-width:42%;flex-shrink:0}
.chrow{display:flex;gap:24px;align-items:center;margin-bottom:18px;cursor:pointer;padding:10px}
.chrow img{width:120px;height:120px;border-radius:50%;object-fit:cover}
.watch{display:flex;gap:24px;max-width:1700px;margin:0 auto}
.wp{flex:1;min-width:0}.ws{width:400px;flex-shrink:0}
.player{background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9}.player iframe{width:100%;height:100%;border:none}
.wt{font-size:20px;font-weight:700;margin:14px 0 10px;line-height:1.35}
.wr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.wc{display:flex;align-items:center;gap:12px}
.pill{padding:9px 16px;background:var(--bg3);border:none;border-radius:20px;color:var(--text);font-size:14px;font-weight:500}.pill:hover{background:var(--bg4)}
.pill.on{background:var(--text);color:#000}.sub{background:var(--text);color:#000}.sub.on{background:var(--bg3);color:var(--text)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.desc{background:var(--bg3);border-radius:var(--r);padding:12px;margin-top:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:110px;overflow:hidden;cursor:pointer}.desc.open{max-height:none}
.cm{display:flex;gap:12px;margin-bottom:18px;font-size:14px;line-height:1.45}.cm b{font-size:13px}.cm span{color:var(--text2);font-size:12px;font-weight:400}
.cm p{white-space:pre-wrap;word-break:break-word}
.rel{display:flex;gap:8px;margin-bottom:10px;cursor:pointer}.rel .th{width:168px;flex-shrink:0;border-radius:8px}.rel .vt{font-size:14px}
.ban{height:160px;background:var(--bg3) center/cover;border-radius:var(--r);margin-bottom:16px}
.chead{display:flex;gap:20px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.chead img{width:90px;height:90px;border-radius:50%}
.sk{background:var(--bg3);border-radius:var(--r);aspect-ratio:16/9;animation:p 1.2s infinite alternate}@keyframes p{to{opacity:.4}}
.msg{text-align:center;padding:60px 20px;color:var(--text2);grid-column:1/-1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a2a2a;padding:11px 24px;border-radius:24px;font-size:14px;z-index:500;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:1000px){.side{position:fixed;left:0;z-index:190;background:var(--bg);transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 50px #000}.watch{flex-direction:column}.ws{width:100%}.row .th{width:200px}}
@media(max-width:640px){.logo span{display:none}.main{padding:12px}.grid{grid-template-columns:1fr}.chrow img{width:70px;height:70px}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header class="header">
  <div class="hl"><button class="ib" onclick="toggleSide()">☰</button><div class="logo" onclick="location.hash='#/'"><i>▶</i><span>Negxus<b>Tube</b></span></div></div>
  <div class="hc"><div class="sb"><input id="q" placeholder="Pesquisar ou colar link  ( / )" autocomplete="off"/><button onclick="doSearch()">🔍</button></div><div class="sug" id="sug"></div></div>
  <div class="hr"><button class="ib" title="Trocar servidor" onclick="resetInst()">⚙️</button></div>
</header>
<div class="layout">
  <aside class="side" id="side">
    <div class="si" data-p="home" onclick="location.hash='#/'"><span class="ic">🏠</span><span class="lb">Início</span></div>
    <div class="si" data-p="subs" onclick="location.hash='#/lib/subs'"><span class="ic">📺</span><span class="lb">Inscrições</span></div>
    <div class="sep"></div>
    <div class="si" data-p="history" onclick="location.hash='#/lib/history'"><span class="ic">🕒</span><span class="lb">Histórico</span></div>
    <div class="si" data-p="later" onclick="location.hash='#/lib/later'"><span class="ic">📋</span><span class="lb">Assistir mais tarde</span></div>
    <div class="si" data-p="liked" onclick="location.hash='#/lib/liked'"><span class="ic">👍</span><span class="lb">Vídeos marcados</span></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
/* Sem chave de API: usa instâncias públicas do Piped (busca, canais, comentários, relacionados) + player oficial do YouTube. */
const INST=['https://pipedapi.kavin.rocks','https://api.piped.private.coffee','https://pipedapi.adminforge.de','https://pipedapi.leptons.xyz'];
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem('nt3_'+k));return v==null?d:v}catch(_){return d}},set(k,v){try{localStorage.setItem('nt3_'+k,JSON.stringify(v))}catch(_){}}};
let base=store.get('inst',null),tok=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('pt-BR',{notation:'compact'});
const num=n=>n>=0&&n!=null?nf.format(n):'';
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2500)}
function toggleSide(){const s=$('side');innerWidth<=1000?s.classList.toggle('open'):s.classList.toggle('col')}
function resetInst(){base=null;store.set('inst',null);toast('Servidor será redescoberto na próxima requisição')}
async function api(path){
  const list=base?[base,...INST.filter(x=>x!==base)]:INST;
  for(const b of list){
    try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
      const r=await fetch(b+path,{signal:c.signal});clearTimeout(t);
      if(!r.ok)continue;const d=await r.json();
      if(d&&!d.error){if(base!==b){base=b;store.set('inst',b)}return d}
    }catch(_){}
  }
  throw new Error('Nenhum servidor respondeu');
}
function parseId(s){s=(s||'').trim();if(/^[\w-]{11}$/.test(s))return s;const m=s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:null}
const idOf=u=>(u||'').split('v=')[1]?.split('&')[0]||'';
const chOf=u=>(u||'').replace('/channel/','');
function fmtDur(s){if(s==null||s<0)return'';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function norm(i){return{id:idOf(i.url),title:i.title,thumb:i.thumbnail,ch:i.uploaderName,chId:chOf(i.uploaderUrl),av:i.uploaderAvatar,views:i.views,date:i.uploadedDate,dur:i.duration}}
const mini=v=>({id:v.id,title:v.title,thumb:v.thumb||`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`,ch:v.ch,chId:v.chId,av:v.av,dur:v.dur});
function avatar(src,name,s=36){return src?`<img class="av" style="width:${s}px;height:${s}px" src="${esc(src)}" loading="lazy" onerror="this.outerHTML='<div class=av>?</div>'">`:`<div class="av" style="width:${s}px;height:${s}px">${esc((name||'?')[0].toUpperCase())}</div>`}
function chLink(v){return v.chId?`<a href="#/channel/${esc(v.chId)}" onclick="event.stopPropagation()">${esc(v.ch)}</a>`:esc(v.ch||'')}
function stats(v){return[v.views!=null&&v.views>=0?num(v.views)+' visualizações':'',v.date].filter(Boolean).join(' • ')}
function card(v){return`<div class="card" onclick="location.hash='#/watch/${v.id}'"><div class="th"><img loading="lazy" src="${esc(v.thumb)}">${v.dur>0?`<span class="dur">${fmtDur(v.dur)}</span>`:''}</div><div class="vm">${avatar(v.av,v.ch)}<div><div class="vt">${esc(v.title)}</div><div class="vc">${chLink(v)}<br>${esc(stats(v))}</div></div></div></div>`}
function rowCard(v){return`<div class="row" onclick="location.hash='#/watch/${v.id}'"><div class="th"><img loading="lazy" src="${esc(v.thumb)}">${v.dur>0?`<span class="dur">${fmtDur(v.dur)}</span>`:''}</div><div><div class="vt" style="font-size:17px">${esc(v.title)}</div><div class="vc">${esc(stats(v))}</div><div class="vc" style="margin-top:8px">${chLink(v)}</div></div></div>`}
function relCard(v){return`<div class="rel" onclick="location.hash='#/watch/${v.id}'"><div class="th"><img loading="lazy" src="${esc(v.thumb)}">${v.dur>0?`<span class="dur">${fmtDur(v.dur)}</span>`:''}</div><div><div class="vt">${esc(v.title)}</div><div class="vc">${esc(v.ch||'')}<br>${esc(stats(v))}</div></div></div>`}
const skel=n=>`<div class="grid">${'<div><div class="sk"></div></div>'.repeat(n)}</div>`;
const fail=(e)=>`<div class="msg"><div style="font-size:44px">📡</div><p>Não consegui falar com os servidores públicos agora.</p><p style="margin-top:8px"><button class="pill" onclick="route()">Tentar de novo</button></p><p style="margin-top:10px;font-size:13px">Você ainda pode colar um link do YouTube na busca.</p></div>`;
function setNav(p){document.querySelectorAll('.si').forEach(e=>e.classList.toggle('on',e.dataset.p===p))}
function htmlToText(h){const d=new DOMParser().parseFromString(String(h||'').replace(/<br\s*\/?>/gi,'\n'),'text/html');return d.body.textContent||''}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" onclick="event.stopPropagation()">$1</a>')}
const L=k=>store.get(k,[]),has=(k,id)=>L(k).some(x=>x.id===id);
function toggleList(k,v,btn,on,off){const l=L(k),i=l.findIndex(x=>x.id===v.id);i>-1?l.splice(i,1):l.unshift(mini(v));store.set(k,l);const a=i===-1;btn.classList.toggle('on',a);btn.textContent=a?on:off;toast(a?'Adicionado':'Removido')}
function toggleSub(c,btn){const l=L('subs'),i=l.findIndex(x=>x.id===c.id);i>-1?l.splice(i,1):l.unshift(c);store.set('subs',l);const a=i===-1;btn.classList.toggle('on',a);btn.textContent=a?'Inscrito ✓':'Inscrever-se';toast(a?'Inscrição adicionada':'Inscrição removida')}

/* ===== ROTAS ===== */
function route(){
  const h=location.hash.replace(/^#\/?/,''),p=h.split('/');tok++;const my=tok;closeSide();scrollTo({top:0});
  if(p[0]==='watch'&&p[1])return watch(p[1],my);
  if(p[0]==='search')return search(decodeURIComponent(p.slice(1).join('/')),'videos',my);
  if(p[0]==='channel'&&p[1])return channel(p[1],my);
  if(p[0]==='lib')return lib(p[1]);
  home(my);
}
addEventListener('hashchange',route);
function closeSide(){if(innerWidth<=1000)$('side').classList.remove('open')}

async function home(my){
  setNav('home');const hist=L('history').slice(0,8);
  $('main').innerHTML=(hist.length?`<h2 class="t">Assistidos recentemente</h2><div class="grid">${hist.map(card).join('')}</div><h2 class="t" style="margin-top:28px">Em alta</h2>`:'<h2 class="t">Em alta</h2>')+`<div id="tr">${skel(8)}</div>`;
  try{const d=await api('/trending?region=BR');if(my!==tok)return;$('tr').innerHTML=`<div class="grid">${d.filter(i=>i.url).map(i=>card(norm(i))).join('')}</div>`}
  catch(e){if(my===tok)$('tr').innerHTML=fail()}
}

async function search(q,filter,my,page){
  setNav('');$('q').value=q;
  const f=filter||'videos';
  if(!page)$('main').innerHTML=`<div class="chips">${[['videos','Vídeos'],['channels','Canais'],['playlists','Playlists']].map(([k,n])=>`<button class="chip ${k===f?'on':''}" onclick="search(decodeURIComponent('${encodeURIComponent(q)}'),'${k}',tok)">${n}</button>`).join('')}</div><div id="res">${skel(6)}</div>`;
  try{
    const d=await api(page?`/nextpage/search?nextpage=${encodeURIComponent(page)}&q=${encodeURIComponent(q)}&filter=${f}`:`/search?q=${encodeURIComponent(q)}&filter=${f}`);
    if(my!==tok)return;
    const html=d.items.map(i=>{
      if(i.type==='stream')return rowCard(norm(i));
      if(i.type==='channel')return`<div class="chrow" onclick="location.hash='#/channel/${chOf(i.url)}'"><img src="${esc(i.thumbnail)}"><div><div class="vt" style="font-size:20px">${esc(i.name)}</div><div class="vc">${num(i.subscribers)} inscritos</div><div class="vc">${esc(i.description||'')}</div></div></div>`;
      if(i.type==='playlist')return`<div class="row"><div class="th"><img src="${esc(i.thumbnail)}"><span class="dur">${i.videos||''} vídeos</span></div><div><div class="vt" style="font-size:17px">${esc(i.name)}</div><div class="vc">${esc(i.uploaderName||'')}</div></div></div>`;
      return'';
    }).join('')||'<div class="msg">Nada encontrado.</div>';
    const r=$('res');
    if(page){r.querySelector('.more')?.remove();r.insertAdjacentHTML('beforeend',html)}else r.innerHTML=html;
    if(d.nextpage)r.insertAdjacentHTML('beforeend',`<div class="more" style="text-align:center"><button class="pill" onclick="search(decodeURIComponent('${encodeURIComponent(q)}'),'${f}',tok,decodeURIComponent('${encodeURIComponent(d.nextpage)}'))">Carregar mais</button></div>`);
  }catch(e){if(my===tok)$('res').innerHTML=fail()}
}

async function watch(id,my){
  setNav('');
  $('main').innerHTML=`<div class="watch"><div class="wp"><div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div><div id="info"><div class="wt">Carregando...</div></div></div><div class="ws" id="rel">${skel(4)}</div></div>`;
  let d;
  try{d=await api('/streams/'+id)}catch(e){if(my===tok)$('info').innerHTML=`<div class="wt">Vídeo</div><div class="vc">Detalhes indisponíveis agora, mas o player funciona.</div>`;$('rel').innerHTML='';return}
  if(my!==tok)return;
  const v={id,title:d.title,thumb:`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,ch:d.uploader,chId:chOf(d.uploaderUrl),av:d.uploaderAvatar,dur:d.duration};
  const h=L('history').filter(x=>x.id!==id);h.unshift(mini(v));store.set('history',h.slice(0,100));
  document.title=d.title+' - NegxusTube';
  const subbed=L('subs').some(x=>x.id===v.chId);
  $('info').innerHTML=`<h1 class="wt">${esc(d.title)}</h1>
  <div class="wr"><div class="wc">${avatar(d.uploaderAvatar,d.uploader,42)}<div><div style="font-weight:500"><a href="#/channel/${esc(v.chId)}" style="color:var(--text)">${esc(d.uploader)}</a></div><div class="vc">${d.uploaderSubscriberCount>0?num(d.uploaderSubscriberCount)+' inscritos':''}</div></div><button class="pill sub ${subbed?'on':''}" id="subBtn">${subbed?'Inscrito ✓':'Inscrever-se'}</button></div>
  <div class="acts"><button class="pill ${has('liked',id)?'on':''}" id="lk">${has('liked',id)?'👍 Gostei':'👍 '+(d.likes>=0?num(d.likes):'Gostei')}</button><button class="pill" id="sh">📤 Compartilhar</button><button class="pill ${has('later',id)?'on':''}" id="wl">${has('later',id)?'📋 Salvo':'📋 Mais tarde'}</button></div></div>
  <div class="desc" id="desc"><b>${num(d.views)} visualizações • ${esc(d.uploadDate||'')}</b>\n${linkify(htmlToText(d.description))}</div>
  <h2 class="t" style="margin-top:22px">Comentários</h2><div id="cms"><div class="vc">Carregando comentários...</div></div>`;
  $('subBtn').onclick=e=>toggleSub({id:v.chId,name:v.ch,av:v.av},e.target);
  $('lk').onclick=e=>toggleList('liked',v,e.target,'👍 Gostei','👍 Gostei');
  $('wl').onclick=e=>toggleList('later',v,e.target,'📋 Salvo','📋 Mais tarde');
  $('sh').onclick=()=>{const u='https://youtu.be/'+id;navigator.clipboard?navigator.clipboard.writeText(u).then(()=>toast('Link copiado!')):toast(u)};
  $('desc').onclick=e=>e.currentTarget.classList.add('open');
  $('rel').innerHTML=(d.relatedStreams||[]).filter(i=>i.type==='stream').map(i=>relCard(norm(i))).join('');
  try{const c=await api('/comments/'+id);if(my!==tok)return;
    $('cms').innerHTML=(c.comments||[]).map(x=>`<div class="cm">${avatar(x.thumbnail,x.author)}<div><b>${esc(x.author)} <span>${esc(x.commentedTime||'')}</span></b><p>${esc(htmlToText(x.commentText))}</p><span>👍 ${num(x.likeCount)}</span></div></div>`).join('')||'<div class="vc">Sem comentários.</div>';
  }catch(_){if(my===tok)$('cms').innerHTML='<div class="vc">Comentários indisponíveis.</div>'}
}

async function channel(id,my){
  setNav('');$('main').innerHTML=skel(6);
  try{const d=await api('/channel/'+id);if(my!==tok)return;
    const subbed=L('subs').some(x=>x.id===id);
    $('main').innerHTML=(d.bannerUrl?`<div class="ban" style="background-image:url('${esc(d.bannerUrl)}')"></div>`:'')+`<div class="chead">${avatar(d.avatarUrl,d.name,90)}<div><h2 style="font-size:24px">${esc(d.name)}</h2><div class="vc">${num(d.subscriberCount)} inscritos</div><div class="vc" style="max-width:600px;margin:6px 0 10px">${esc((d.description||'').slice(0,160))}</div><button class="pill sub ${subbed?'on':''}" id="sb2">${subbed?'Inscrito ✓':'Inscrever-se'}</button></div></div><h2 class="t">Vídeos</h2><div class="grid">${(d.relatedStreams||[]).map(i=>card({...norm(i),ch:d.name,chId:id,av:d.avatarUrl})).join('')}</div>`;
    $('sb2').onclick=e=>toggleSub({id,name:d.name,av:d.avatarUrl},e.target);
  }catch(e){if(my===tok)$('main').innerHTML=fail()}
}

function lib(kind){
  setNav(kind);const t={history:'🕒 Histórico',later:'📋 Assistir mais tarde',liked:'👍 Vídeos marcados',subs:'📺 Inscrições'}[kind];
  const l=L(kind);let body;
  if(!l.length)body='<div class="msg"><div style="font-size:44px">📭</div>Nada por aqui ainda.</div>';
  else if(kind==='subs')body=l.map(c=>`<div class="chrow" onclick="location.hash='#/channel/${esc(c.id)}'">${avatar(c.av,c.name,70)}<div class="vt" style="font-size:18px">${esc(c.name)}</div></div>`).join('');
  else body=`<div class="grid">${l.map(card).join('')}</div>`;
  $('main').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="t">${t}</h2>${l.length&&kind!=='subs'?`<button class="pill" onclick="store.set('${kind}',[]);lib('${kind}')">Limpar</button>`:''}</div>`+body;
}

/* ===== BUSCA + SUGESTÕES ===== */
function doSearch(){
  const v=$('q').value.trim();if(!v)return;$('sug').style.display='none';
  const id=parseId(v);
  if(id){$('q').value='';location.hash='#/watch/'+id}else location.hash='#/search/'+encodeURIComponent(v);
}
let sugT;
$('q').addEventListener('input',e=>{
  clearTimeout(sugT);const v=e.target.value.trim();
  if(v.length<2){$('sug').style.display='none';return}
  sugT=setTimeout(async()=>{try{const s=await api('/suggestions?query='+encodeURIComponent(v));
    $('sug').innerHTML=s.slice(0,8).map(x=>`<div>🔍 ${esc(x)}</div>`).join('');$('sug').style.display=s.length?'block':'none';
    [...$('sug').children].forEach((el,i)=>el.onclick=()=>{$('q').value=s[i];doSearch()});
  }catch(_){}},250);
});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
document.addEventListener('click',e=>{if(!e.target.closest('.hc'))$('sug').style.display='none'});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus()}});
route();
</script>
</body>
