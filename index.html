<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeFlix - Player Alternativo</title>
    
    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ===== ESTILOS (mesmo do código anterior, mantido) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #ff0000, #cc0000); border-radius: 10px; }

        .header {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 900;
            font-size: 24px;
            color: #ff0000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            letter-spacing: -0.5px;
        }
        .logo span { color: #fff; font-weight: 700; }
        .logo small { font-size: 11px; color: #666; font-weight: 400; }
        .logo .play-icon {
            display: inline-flex;
            background: #ff0000;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
        }

        .search-box {
            flex: 1;
            max-width: 600px;
            display: flex;
            min-width: 180px;
            background: #1a1a1a;
            border-radius: 30px;
            overflow: hidden;
            border: 1.5px solid #2a2a2a;
            transition: all 0.3s ease;
        }
        .search-box:focus-within {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.1);
        }
        .search-box input {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .search-box input::placeholder { color: #666; }
        .search-box button {
            padding: 12px 22px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }
        .search-box button:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }
        .header-actions .btn {
            padding: 10px 22px;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .header-actions .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.3);
        }
        .header-actions .btn-outline {
            background: transparent;
            border: 1.5px solid #333;
            color: #aaa;
        }
        .header-actions .btn-outline:hover {
            background: #1a1a1a;
            border-color: #555;
            transform: translateY(-2px);
        }

        .container {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
        }

        .sidebar {
            width: 240px;
            padding: 16px 12px;
            position: sticky;
            top: 70px;
            height: calc(100vh - 70px);
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-section .title {
            font-size: 11px;
            text-transform: uppercase;
            color: #444;
            padding: 8px 16px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .sidebar-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .sidebar-item:hover {
            background: #1a1a1a;
            color: #fff;
            transform: translateX(4px);
        }
        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(255,0,0,0.15), rgba(204,0,0,0.05));
            color: #ff0000;
        }
        .sidebar-item .icon { font-size: 20px; width: 28px; text-align: center; }
        .sidebar-item .badge {
            margin-left: auto;
            background: #1a1a1a;
            color: #888;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .sidebar-item.active .badge {
            background: rgba(255,0,0,0.2);
            color: #ff0000;
        }

        .main-content {
            flex: 1;
            padding: 24px 32px;
            min-width: 0;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .section-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .section-actions .filter-btn {
            padding: 8px 18px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            color: #666;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .section-actions .filter-btn:hover {
            background: #1a1a1a;
            color: #fff;
            border-color: #444;
        }
        .section-actions .filter-btn.active {
            background: linear-gradient(135deg, rgba(255,0,0,0.2), rgba(204,0,0,0.1));
            border-color: #ff0000;
            color: #ff0000;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        .video-card {
            background: #111;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .video-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .video-card .thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
        }
        .video-card .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .video-card:hover .thumbnail img { transform: scale(1.05); }
        .video-card .duration {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            backdrop-filter: blur(10px);
        }
        .video-card .shorts-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .video-card .info {
            padding: 16px 18px 18px;
        }
        .video-card .title {
            font-weight: 600;
            font-size: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
            margin-bottom: 6px;
            color: #f0f0f0;
        }
        .video-card .channel {
            font-size: 13px;
            color: #888;
            font-weight: 400;
        }
        .video-card .meta {
            font-size: 13px;
            color: #555;
            display: flex;
            gap: 12px;
            margin-top: 6px;
            align-items: center;
        }
        .video-card .meta .dot { color: #444; }
        .video-card .actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .video-card .actions button {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
        }
        .video-card .actions button:hover {
            background: #1a1a1a;
            color: #fff;
        }
        .video-card .actions button.saved { color: #ff0000; }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }
        .loading .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }
        .no-results .emoji {
            font-size: 56px;
            margin-bottom: 20px;
            display: block;
        }
        .no-results p { font-size: 18px; color: #444; }

        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            backdrop-filter: blur(40px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .player-overlay.active { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .player-container {
            background: #111;
            border-radius: 20px;
            max-width: 1200px;
            width: 100%;
            max-height: 92vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }
        .player-header {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            background: #0a0a0a;
        }
        .player-header h2 {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 16px;
            color: #f0f0f0;
        }
        .player-header .close-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #888;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-header .close-btn:hover {
            background: rgba(255,0,0,0.2);
            color: #ff0000;
            transform: rotate(90deg);
        }
        .player-body {
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            flex: 1;
            background: #0a0a0a;
        }
        .player-wrapper {
            flex: 1;
            min-width: 320px;
            min-height: 340px;
            background: #000;
            position: relative;
        }
        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            min-height: 340px;
            border: none;
            border-radius: 0;
        }
        .player-sidebar {
            width: 340px;
            padding: 20px 24px;
            overflow-y: auto;
            background: #0d0d0d;
            flex-shrink: 0;
            max-height: 540px;
        }
        .player-sidebar .video-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
            color: #f0f0f0;
        }
        .player-sidebar .video-meta {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
        }
        .player-sidebar .channel-info {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .player-sidebar .channel-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
            color: #fff;
        }
        .player-sidebar .channel-name {
            font-weight: 600;
            font-size: 15px;
            color: #f0f0f0;
        }
        .player-sidebar .channel-subs {
            font-size: 13px;
            color: #666;
        }
        .player-sidebar .description {
            font-size: 14px;
            color: #888;
            line-height: 1.7;
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 16px;
            background: #0a0a0a;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .player-sidebar .actions-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .player-sidebar .actions-row button {
            padding: 10px 20px;
            background: #1a1a1a;
            border: none;
            border-radius: 30px;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .player-sidebar .actions-row button:hover {
            background: #2a2a2a;
            color: #fff;
            transform: translateY(-2px);
        }
        .player-sidebar .actions-row button.liked {
            background: rgba(255,0,0,0.15);
            color: #ff0000;
        }
        .player-sidebar .actions-row button.saved {
            background: rgba(255,0,0,0.15);
            color: #ff0000;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a1a1a;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 1024px) {
            .player-sidebar { width: 100%; max-height: 260px; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .header { padding: 10px 16px; gap: 12px; }
            .logo { font-size: 18px; }
            .logo .play-icon { width: 28px; height: 28px; font-size: 12px; }
            .search-box { max-width: 100%; flex: 1 1 100%; order: 3; }
            .search-box input { padding: 10px 16px; font-size: 13px; }
            .main-content { padding: 16px; }
            .section-title { font-size: 20px; }
            .player-overlay { padding: 0; }
            .player-container { max-height: 100vh; border-radius: 0; }
            .player-wrapper iframe { min-height: 200px; }
            .player-header h2 { font-size: 14px; }
            .player-sidebar { padding: 16px; }
            .player-sidebar .video-title { font-size: 16px; }
        }
        @media (max-width: 480px) {
            .video-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .video-card .info { padding: 10px 12px 14px; }
            .video-card .title { font-size: 12px; }
            .video-card .channel { font-size: 11px; }
            .video-card .meta { font-size: 11px; }
            .video-card .actions button { font-size: 10px; padding: 4px 10px; }
            .section-title { font-size: 18px; }
            .section-actions .filter-btn { font-size: 11px; padding: 6px 14px; }
            .header-actions .btn { font-size: 11px; padding: 8px 14px; }
            .header-actions .btn-outline { padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo" onclick="goHome()">
            <span class="play-icon">▶</span>
            <span>Pipe</span><span style="color:#ff0000;">Flix</span>
            <small>beta</small>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar vídeos..." onkeypress="if(event.key==='Enter') searchVideos()">
            <button onclick="searchVideos()">🔍</button>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="importSubscriptions()">📥 Importar</button>
            <button class="btn" onclick="loginUser()" id="loginBtn">Entrar</button>
        </div>
    </header>

    <!-- CONTAINER -->
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="title">Menu</div>
                <div class="sidebar-item active" onclick="setActive(this, 'feed')">
                    <span class="icon">📺</span> Feed <span class="badge" id="feedCount">0</span>
                </div>
                <div class="sidebar-item" onclick="setActive(this, 'subscriptions')">
                    <span class="icon">📋</span> Inscrições
                </div>
                <div class="sidebar-item" onclick="setActive(this, 'watchlater')">
                    <span class="icon">⏰</span> Assistir mais tarde <span class="badge" id="wlCount">0</span>
                </div>
                <div class="sidebar-item" onclick="setActive(this, 'downloaded')">
                    <span class="icon">⬇️</span> Baixados
                </div>
            </div>
            <div class="sidebar-section">
                <div class="title">Filtros</div>
                <div class="sidebar-item" onclick="toggleFilter(this, 'shorts')">
                    <span class="icon">🚫</span> Ocultar Shorts
                </div>
                <div class="sidebar-item" onclick="toggleFilter(this, 'watched')">
                    <span class="icon">👁️</span> Ocultar Assistidos
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="section-header">
                <h1 class="section-title" id="sectionTitle">📺 Feed</h1>
                <div class="section-actions" id="sectionActions">
                    <button class="filter-btn active" onclick="setFilter(this, 'all')">Todos</button>
                    <button class="filter-btn" onclick="setFilter(this, 'recent')">Recentes</button>
                    <button class="filter-btn" onclick="setFilter(this, 'popular')">Populares</button>
                </div>
            </div>
            <div id="videoGrid" class="video-grid"></div>
            <div id="loadingIndicator" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>Carregando vídeos incríveis...</p>
            </div>
            <div id="noResults" class="no-results" style="display:none;">
                <span class="emoji">📭</span>
                <p>Nenhum vídeo encontrado</p>
            </div>
        </main>
    </div>

    <!-- PLAYER OVERLAY -->
    <div class="player-overlay" id="playerOverlay">
        <div class="player-container">
            <div class="player-header">
                <h2 id="playerTitle">Vídeo</h2>
                <button class="close-btn" onclick="closePlayer()">✕</button>
            </div>
            <div class="player-body">
                <div class="player-wrapper" id="playerWrapper">
                    <iframe id="playerIframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
                </div>
                <div class="player-sidebar" id="playerSidebar">
                    <div class="video-title" id="pTitle">Título</div>
                    <div class="video-meta" id="pMeta">0 visualizações</div>
                    <div class="channel-info">
                        <div class="channel-avatar" id="pAvatar">📺</div>
                        <div>
                            <div class="channel-name" id="pChannel">Canal</div>
                            <div class="channel-subs" id="pSubs">0 inscritos</div>
                        </div>
                    </div>
                    <div class="description" id="pDesc">Descrição...</div>
                    <div class="actions-row">
                        <button onclick="togglePlayerLike()" id="pLikeBtn">👍 Curtir</button>
                        <button onclick="togglePlayerSave()" id="pSaveBtn">⏰ Salvar</button>
                        <button onclick="downloadCurrentVideo()" id="pDownloadBtn">⬇️ Baixar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  PIPEFLIX - COM API DO INVIDIOUS (VÍDEOS REAIS)
        // ============================================================

        // ===== CONFIGURAÇÃO =====
        // Usamos uma instância pública do Invidious (sem necessidade de chave)
        const INVIDIOUS_INSTANCE = 'https://invidious.namazso.eu';
        // Alternativas: https://invidious.snopyta.org, https://yewtu.be, etc.

        const CONFIG = {
            apiBase: INVIDIOUS_INSTANCE,
            filters: { hideShorts: false, hideWatched: false },
            currentFilter: 'all'
        };

        // ===== ESTADO =====
        let state = {
            user: null,
            subscriptions: [],
            feed: [],
            watchLater: [],
            downloaded: [],
            viewed: [],
            currentVideoId: null,
            currentChannelId: null,
            currentView: 'feed',
            isLoading: false,
            currentVideoData: null
        };

        // ===== TOAST =====
        function showToast(msg, duration = 3000) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), duration);
        }

        // ===== DADOS LOCAIS =====
        function loadData() {
            try {
                const raw = localStorage.getItem('pipeline_data');
                if (raw) {
                    const data = JSON.parse(raw);
                    state.subscriptions = data.subscriptions || [];
                    state.watchLater = data.watchLater || [];
                    state.downloaded = data.downloaded || [];
                    state.viewed = data.viewed || [];
                    if (data.user) state.user = data.user;
                    updateUI();
                }
            } catch (e) { console.warn('Erro ao carregar dados:', e); }
        }

        function saveData() {
            try {
                localStorage.setItem('pipeline_data', JSON.stringify({
                    user: state.user,
                    subscriptions: state.subscriptions,
                    watchLater: state.watchLater,
                    downloaded: state.downloaded,
                    viewed: state.viewed
                }));
            } catch (e) { console.warn('Erro ao salvar dados:', e); }
        }

        // ===== USUÁRIO =====
        function loginUser() {
            if (state.user) {
                state.user = null;
                document.getElementById('loginBtn').textContent = 'Entrar';
                saveData();
                showToast('Desconectado');
                return;
            }
            const name = prompt('Digite seu nome:');
            if (name && name.trim()) {
                state.user = { name: name.trim(), id: Date.now().toString(36) };
                document.getElementById('loginBtn').textContent = state.user.name;
                saveData();
                showToast('👋 Bem-vindo, ' + state.user.name + '!');
            }
        }

        // ===== FILTROS =====
        function toggleFilter(el, filter) {
            el.classList.toggle('active');
            if (filter === 'shorts') CONFIG.filters.hideShorts = !CONFIG.filters.hideShorts;
            if (filter === 'watched') CONFIG.filters.hideWatched = !CONFIG.filters.hideWatched;
            renderFeed();
        }

        function setFilter(el, filter) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            CONFIG.currentFilter = filter;
            renderFeed();
        }

        // ===== SIDEBAR =====
        function setActive(el, view) {
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            state.currentView = view;
            document.getElementById('sectionTitle').textContent = 
                view === 'feed' ? '📺 Feed' :
                view === 'subscriptions' ? '📋 Inscrições' :
                view === 'watchlater' ? '⏰ Assistir mais tarde' : '⬇️ Baixados';
            
            if (view === 'feed') loadFeed();
            else if (view === 'subscriptions') renderSubscriptions();
            else if (view === 'watchlater') renderWatchLater();
            else if (view === 'downloaded') renderDownloaded();
        }

        function goHome() {
            const first = document.querySelector('.sidebar-item');
            if (first) setActive(first, 'feed');
        }

        // ===== BUSCAR VÍDEOS COM A API DO INVIDIOUS =====
        async function loadFeed(query = '') {
            if (state.isLoading) return;
            state.isLoading = true;
            
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('videoGrid').innerHTML = '';
            document.getElementById('noResults').style.display = 'none';

            try {
                const searchQuery = query || 'programação';
                // Usamos o endpoint de busca do Invidious
                const url = `${CONFIG.apiBase}/api/v1/search?q=${encodeURIComponent(searchQuery)}&type=video`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                // O Invidious retorna um array de resultados
                const results = data || [];
                
                if (!results || results.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                    document.getElementById('loadingIndicator').style.display = 'none';
                    state.isLoading = false;
                    return;
                }

                state.feed = results.map(v => ({
                    id: v.videoId,
                    title: v.title || 'Sem título',
                    channel: v.author || 'Desconhecido',
                    channelId: v.authorId || '',
                    thumb: v.videoThumbnails?.[v.videoThumbnails.length - 1]?.url || `https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg`,
                    views: parseInt(v.viewCount) || 0,
                    duration: v.lengthSeconds || 0,
                    published: v.published || Date.now() / 1000,
                    isShort: (v.lengthSeconds && v.lengthSeconds < 60) || false,
                    watched: state.viewed.includes(v.videoId),
                    description: v.description || ''
                }));

                document.getElementById('feedCount').textContent = state.feed.length;
                renderFeed();
                showToast(`✅ ${state.feed.length} vídeos carregados!`);

            } catch (err) {
                console.warn('Erro ao carregar feed do Invidious:', err);
                showToast('❌ Erro ao carregar, usando fallback');
                loadFallbackFeed();
            }

            document.getElementById('loadingIndicator').style.display = 'none';
            state.isLoading = false;
        }

        // ===== FALLBACK (vídeos reais do YouTube) =====
        function loadFallbackFeed() {
            state.feed = [
                { id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up (Official Music Video)', channel: 'Rick Astley', channelId: 'UCJtUOos_MwL_EfR6LJjYJvg', thumb: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg', views: 1300000000, duration: 213, published: Date.now()/1000 - 86400*365*12, isShort: false, watched: false, description: 'Rick Astley - Never Gonna Give You Up (Official Music Video)' },
                { id: '9bZkp7q19f0', title: 'PSY - GANGNAM STYLE (강남스타일) MV', channel: 'PSY', channelId: 'UCBuS4EwM4E2Mh9k0V8l0xHQ', thumb: 'https://img.youtube.com/vi/9bZkp7q19f0/hqdefault.jpg', views: 4800000000, duration: 252, published: Date.now()/1000 - 86400*365*11, isShort: false, watched: false, description: 'PSY - GANGNAM STYLE' },
                { id: 'kJQP7kiw5Fk', title: 'Luis Fonsi - Despacito ft. Daddy Yankee', channel: 'Luis Fonsi', channelId: 'UC5XhJfH8t4zFwZkFv-nXAKQ', thumb: 'https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg', views: 8200000000, duration: 281, published: Date.now()/1000 - 86400*365*7, isShort: false, watched: false, description: 'Luis Fonsi - Despacito ft. Daddy Yankee' },
                { id: 'CevxZvSJLk8', title: 'Alan Walker - Faded (Official Music Video)', channel: 'Alan Walker', channelId: 'UCJrOtniJ0-NWz37R6u8ZpFA', thumb: 'https://img.youtube.com/vi/CevxZvSJLk8/hqdefault.jpg', views: 3400000000, duration: 212, published: Date.now()/1000 - 86400*365*8, isShort: false, watched: false, description: 'Alan Walker - Faded' },
                { id: 'wJ9OUXG8hUE', title: 'C418 - Sweden (Minecraft Soundtrack)', channel: 'C418', channelId: 'UC5p7t5t8t5t8t5t8t5t8t5t8', thumb: 'https://img.youtube.com/vi/wJ9OUXG8hUE/hqdefault.jpg', views: 50000000, duration: 232, published: Date.now()/1000 - 86400*365*13, isShort: false, watched: false, description: 'C418 - Sweden' },
            ];
            document.getElementById('feedCount').textContent = state.feed.length;
            renderFeed();
            showToast('📡 Modo offline (vídeos de exemplo)');
        }

        // ===== RENDER FEED =====
        function renderFeed() {
            const grid = document.getElementById('videoGrid');
            let videos = [...state.feed];

            if (CONFIG.filters.hideShorts) videos = videos.filter(v => !v.isShort);
            if (CONFIG.filters.hideWatched) videos = videos.filter(v => !v.watched);

            if (CONFIG.currentFilter === 'recent') {
                videos.sort((a, b) => b.published - a.published);
            } else if (CONFIG.currentFilter === 'popular') {
                videos.sort((a, b) => b.views - a.views);
            }

            if (videos.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                grid.innerHTML = '';
                return;
            }
            document.getElementById('noResults').style.display = 'none';

            const isSubscribed = (channelId) => state.subscriptions.some(s => s.id === channelId);
            const isSaved = (id) => state.watchLater.includes(id);
            const isDownloaded = (id) => state.downloaded.includes(id);

            grid.innerHTML = videos.map(v => `
                <div class="video-card" onclick="playVideo('${v.id}')">
                    <div class="thumbnail">
                        <img src="${v.thumb}" alt="${v.title}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg'">
                        <div class="duration">${formatDuration(v.duration)}</div>
                        ${v.isShort ? '<div class="shorts-badge">#Shorts</div>' : ''}
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="channel">${v.channel}</div>
                        <div class="meta">
                            <span>${formatViews(v.views)}</span>
                            <span class="dot">•</span>
                            <span>${formatDate(v.published)}</span>
                            ${v.watched ? '<span style="color:#444;">• 👁️</span>' : ''}
                        </div>
                        <div class="actions">
                            <button onclick="event.stopPropagation();toggleSubscribe('${v.channelId}','${v.channel}')" 
                                    style="color:${isSubscribed(v.channelId) ? '#ff0000' : '#666'}">
                                ${isSubscribed(v.channelId) ? '✅' : '➕'} Inscrever
                            </button>
                            <button onclick="event.stopPropagation();toggleSave('${v.id}')" 
                                    class="${isSaved(v.id) ? 'saved' : ''}">
                                ${isSaved(v.id) ? '⏰ Salvo' : '⏰ Salvar'}
                            </button>
                            <button onclick="event.stopPropagation();downloadVideo('${v.id}')">
                                ${isDownloaded(v.id) ? '⬇️ Baixado' : '⬇️'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('wlCount').textContent = state.watchLater.length;
        }

        // ===== INSCRIÇÕES =====
        function toggleSubscribe(channelId, channelName) {
            if (!state.user) { showToast('Faça login para se inscrever'); return; }
            if (!channelId) { showToast('ID do canal inválido'); return; }
            const idx = state.subscriptions.findIndex(s => s.id === channelId);
            if (idx > -1) {
                state.subscriptions.splice(idx, 1);
                showToast('Inscrição cancelada: ' + channelName);
            } else {
                state.subscriptions.push({ id: channelId, name: channelName, avatar: channelName.charAt(0) });
                showToast('✅ Inscrito em: ' + channelName);
            }
            saveData();
            renderFeed();
        }

        function renderSubscriptions() {
            const grid = document.getElementById('videoGrid');
            if (state.subscriptions.length === 0) {
                grid.innerHTML = `<div class="no-results"><span class="emoji">📋</span><p>Você ainda não tem inscrições. Pesquise e inscreva-se em canais!</p></div>`;
                return;
            }
            grid.innerHTML = state.subscriptions.map(s => `
                <div class="video-card" style="padding:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#0d0d0d;">
                    <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ff0000,#cc0000);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex-shrink:0;color:#fff;">${s.avatar}</div>
                    <div style="flex:1;">
                        <div style="font-weight:600;font-size:17px;color:#f0f0f0;">${s.name}</div>
                        <div style="font-size:13px;color:#555;">ID: ${s.id}</div>
                    </div>
                    <button onclick="unsubscribeChannel('${s.id}')" style="padding:8px 20px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:30px;color:#ff0000;cursor:pointer;font-weight:500;transition:all 0.3s;font-family:Inter,sans-serif;">Cancelar</button>
                </div>
            `).join('');
        }

        function unsubscribeChannel(channelId) {
            state.subscriptions = state.subscriptions.filter(s => s.id !== channelId);
            saveData();
            renderSubscriptions();
            showToast('Inscrição removida');
        }

        // ===== ASSISTIR MAIS TARDE =====
        function toggleSave(videoId) {
            if (!state.user) { showToast('Faça login para salvar'); return; }
            const idx = state.watchLater.indexOf(videoId);
            if (idx > -1) {
                state.watchLater.splice(idx, 1);
                showToast('Removido de "Assistir mais tarde"');
            } else {
                state.watchLater.push(videoId);
                showToast('⏰ Salvo em "Assistir mais tarde"');
            }
            saveData();
            renderFeed();
            document.getElementById('wlCount').textContent = state.watchLater.length;
        }

        function renderWatchLater() {
            const grid = document.getElementById('videoGrid');
            const saved = state.feed.filter(v => state.watchLater.includes(v.id));
            if (saved.length === 0) {
                grid.innerHTML = `<div class="no-results"><span class="emoji">⏰</span><p>Nenhum vídeo salvo para assistir mais tarde</p></div>`;
                return;
            }
            grid.innerHTML = saved.map(v => `
                <div class="video-card" onclick="playVideo('${v.id}')">
                    <div class="thumbnail">
                        <img src="${v.thumb}" alt="${v.title}">
                        <div class="duration">${formatDuration(v.duration)}</div>
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="channel">${v.channel}</div>
                        <div class="meta">${formatViews(v.views)} visualizações</div>
                        <div class="actions">
                            <button onclick="event.stopPropagation();toggleSave('${v.id}')" style="color:#ff0000;">⏰ Remover</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ===== DOWNLOAD =====
        function downloadVideo(videoId) {
            if (!state.user) { showToast('Faça login para baixar'); return; }
            if (state.downloaded.includes(videoId)) {
                state.downloaded = state.downloaded.filter(id => id !== videoId);
                showToast('Download removido');
            } else {
                state.downloaded.push(videoId);
                showToast('⬇️ Vídeo baixado! (offline)');
            }
            saveData();
            renderFeed();
        }

        function downloadCurrentVideo() {
            if (state.currentVideoId) {
                downloadVideo(state.currentVideoId);
                const isDownloaded = state.downloaded.includes(state.currentVideoId);
                document.getElementById('pDownloadBtn').textContent = isDownloaded ? '⬇️ Baixado' : '⬇️ Baixar';
            }
        }

        function renderDownloaded() {
            const grid = document.getElementById('videoGrid');
            const downloaded = state.feed.filter(v => state.downloaded.includes(v.id));
            if (downloaded.length === 0) {
                grid.innerHTML = `<div class="no-results"><span class="emoji">⬇️</span><p>Nenhum vídeo baixado</p></div>`;
                return;
            }
            grid.innerHTML = downloaded.map(v => `
                <div class="video-card" onclick="playVideo('${v.id}')">
                    <div class="thumbnail">
                        <img src="${v.thumb}" alt="${v.title}">
                        <div class="duration">${formatDuration(v.duration)}</div>
                        <div style="position:absolute;top:10px;left:10px;background:rgba(0,255,0,0.2);color:#00ff88;font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid rgba(0,255,0,0.2);">⬇️ OFFLINE</div>
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="channel">${v.channel}</div>
                    </div>
                </div>
            `).join('');
        }

        // ===== IMPORTAÇÃO =====
        function importSubscriptions() {
            const text = prompt('Cole suas inscrições do NewPipe/YouTube (IDs separados por vírgula):');
            if (!text) return;
            const ids = text.split(',').map(s => s.trim()).filter(s => s);
            let count = 0;
            ids.forEach(id => {
                if (!state.subscriptions.some(s => s.id === id)) {
                    state.subscriptions.push({ id, name: 'Canal ' + id, avatar: id.charAt(0).toUpperCase() });
                    count++;
                }
            });
            saveData();
            showToast(`✅ ${count} inscrições importadas!`);
            renderSubscriptions();
        }

        // ===== PLAYER (iframe do YouTube) =====
        function playVideo(videoId) {
            state.currentVideoId = videoId;
            document.getElementById('playerOverlay').classList.add('active');
            document.getElementById('playerTitle').textContent = 'Carregando...';

            // Buscar detalhes do vídeo (opcional, para exibir no sidebar)
            fetchVideoDetails(videoId);
        }

        async function fetchVideoDetails(videoId) {
            try {
                // Tentar obter detalhes do Invidious
                const url = `${CONFIG.apiBase}/api/v1/videos/${videoId}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                if (data) {
                    state.currentVideoData = data;
                    const title = data.title || 'Vídeo';
                    const channel = data.author || 'Canal';
                    const views = data.viewCount || 0;
                    const description = data.description || 'Sem descrição';
                    const subs = data.subCount || 0;

                    document.getElementById('playerTitle').textContent = title;
                    document.getElementById('pTitle').textContent = title;
                    document.getElementById('pMeta').textContent = formatViews(views) + ' visualizações';
                    document.getElementById('pChannel').textContent = channel;
                    document.getElementById('pSubs').textContent = subs ? formatViews(subs) + ' inscritos' : '';
                    document.getElementById('pDesc').textContent = description;
                    document.getElementById('pAvatar').textContent = channel.charAt(0).toUpperCase();

                    state.currentChannelId = data.authorId || '';
                }
            } catch (err) {
                console.warn('Erro ao carregar detalhes:', err);
                // Se falhar, ao menos o vídeo toca
            }

            // Configurar o iframe com o vídeo
            setupPlayer(videoId);
            updatePlayerButtons(videoId);
        }

        function setupPlayer(videoId) {
            const wrapper = document.getElementById('playerWrapper');
            const iframe = document.getElementById('playerIframe');
            
            // Define a URL do embed com parâmetros
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&showinfo=0&controls=1&enablejsapi=1`;
            iframe.src = embedUrl;

            // Atualiza título se ainda não foi
            if (document.getElementById('playerTitle').textContent === 'Carregando...') {
                document.getElementById('playerTitle').textContent = 'Vídeo';
            }
        }

        function updatePlayerButtons(videoId) {
            const isLiked = state.viewed.includes(videoId);
            document.getElementById('pLikeBtn').textContent = isLiked ? '❤️ Curtido' : '👍 Curtir';
            document.getElementById('pLikeBtn').className = isLiked ? 'liked' : '';

            const isSaved = state.watchLater.includes(videoId);
            document.getElementById('pSaveBtn').textContent = isSaved ? '⏰ Salvo' : '⏰ Salvar';
            document.getElementById('pSaveBtn').className = isSaved ? 'saved' : '';

            const isDownloaded = state.downloaded.includes(videoId);
            document.getElementById('pDownloadBtn').textContent = isDownloaded ? '⬇️ Baixado' : '⬇️ Baixar';

            // Marcar como assistido
            if (!state.viewed.includes(videoId)) {
                state.viewed.push(videoId);
                const v = state.feed.find(f => f.id === videoId);
                if (v) v.watched = true;
                saveData();
                renderFeed();
            }
        }

        function closePlayer() {
            document.getElementById('playerOverlay').classList.remove('active');
            const iframe = document.getElementById('playerIframe');
            if (iframe) iframe.src = '';
            state.currentVideoId = null;
            state.currentVideoData = null;
        }

        function togglePlayerLike() {
            if (!state.user) { showToast('Faça login para curtir'); return; }
            const btn = document.getElementById('pLikeBtn');
            const isLiked = btn.classList.contains('liked');
            if (isLiked) {
                btn.classList.remove('liked');
                btn.textContent = '👍 Curtir';
                showToast('Curtida removida');
            } else {
                btn.classList.add('liked');
                btn.textContent = '❤️ Curtido';
                showToast('👍 Curtido!');
            }
        }

        function togglePlayerSave() {
            if (state.currentVideoId) toggleSave(state.currentVideoId);
            const isSaved = state.watchLater.includes(state.currentVideoId);
            const btn = document.getElementById('pSaveBtn');
            btn.textContent = isSaved ? '⏰ Salvo' : '⏰ Salvar';
            btn.className = isSaved ? 'saved' : '';
        }

        // ===== PESQUISA =====
        function searchVideos() {
            const q = document.getElementById('searchInput').value.trim();
            if (q) {
                loadFeed(q);
            }
        }

        // ===== UTILITÁRIOS =====
        function formatDuration(seconds) {
            if (!seconds || seconds < 0) return '0:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            return `${m}:${String(s).padStart(2,'0')}`;
        }

        function formatViews(n) {
            if (!n) return '0';
            if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
            return String(n);
        }

        function formatDate(ts) {
            if (!ts) return 'data desconhecida';
            const d = new Date(ts * 1000);
            if (isNaN(d.getTime())) return 'data desconhecida';
            const now = Date.now();
            const diff = now - d.getTime();
            const days = Math.floor(diff / 86400000);
            if (days > 365) return Math.floor(days/365) + ' ano' + (days>365?'s':'');
            if (days > 30) return Math.floor(days/30) + ' mês' + (days>30?'es':'');
            if (days > 0) return days + ' dia' + (days>1?'s':'');
            return 'hoje';
        }

        function updateUI() {
            document.getElementById('feedCount').textContent = state.feed.length;
            document.getElementById('wlCount').textContent = state.watchLater.length;
            if (state.user) document.getElementById('loginBtn').textContent = state.user.name;
        }

        // ===== FECHAR PLAYER COM ESC =====
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

        // ===== INICIAR =====
        loadData();
        loadFeed();
    </script>
</body>
</html>
