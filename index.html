<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NegxusTube</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0f0f;--bg2:#181818;--bg3:#212121;--bg4:#2a2a2a;--text:#f1f1f1;--text2:#aaa;--text3:#717171;--red:#ff0033;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px}
button{font-family:inherit;cursor:pointer}
.header{position:fixed;top:0;left:0;right:0;height:60px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:200;border-bottom:1px solid rgba(255,255,255,.06)}
.header-left,.header-right{display:flex;align-items:center;gap:6px}
.menu-btn,.icon-btn{width:40px;height:40px;border:none;background:transparent;color:var(--text);border-radius:50%;font-size:18px}
.menu-btn:hover,.icon-btn:hover{background:var(--bg3)}
.logo{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;border-radius:8px;user-select:none}
.logo:hover{background:var(--bg3)}
.logo-icon{background:var(--red);width:34px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.logo-text{font-size:19px;font-weight:700;letter-spacing:-.5px}.logo-text b{color:var(--red);font-weight:900}
.header-center{flex:1;display:flex;justify-content:center;max-width:720px}
.search-bar{display:flex;width:100%;max-width:600px}
.search-bar input{flex:1;height:42px;background:var(--bg2);border:1px solid #303030;border-right:none;border-radius:22px 0 0 22px;padding:0 18px;color:var(--text);font-size:15px;outline:none;font-family:inherit}
.search-bar input:focus{border-color:#3a5fa8}
.search-btn{width:64px;height:42px;background:var(--bg3);border:1px solid #303030;border-radius:0 22px 22px 0;color:var(--text);font-size:16px}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--red),#ff6b00);border:none;color:#fff;font-weight:700;font-size:14px;margin-left:6px}
.layout{display:flex;padding-top:60px}
.sidebar{width:220px;flex-shrink:0;height:calc(100vh - 60px);overflow-y:auto;padding:12px;position:sticky;top:60px;transition:width .25s}
.sidebar.collapsed{width:72px}.sidebar.collapsed .side-label{display:none}
.sidebar.collapsed .side-item{justify-content:center;padding:14px 0}
.nav-section{padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.side-item{display:flex;align-items:center;gap:22px;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.side-item:hover,.side-item.active{background:var(--bg3)}.side-item.active{font-weight:500}
.side-item .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.main-content{flex:1;padding:20px 28px;min-width:0}
.hint{background:var(--bg2);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;font-size:14px;color:var(--text2);line-height:1.5}
.hint b{color:var(--text)}
.page-title{margin-bottom:18px;font-size:18px}
.videos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 16px}
.video-card{cursor:pointer}
.thumb-wrap{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:var(--bg3)}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.video-meta{display:flex;gap:12px;padding:12px 4px 0}
.channel-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,#666,#333)}
.video-info{min-width:0}
.video-title{font-size:15px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.video-channel{font-size:13px;color:var(--text2)}
.watch-layout{display:flex;gap:24px;max-width:1750px;margin:0 auto}
.watch-primary{flex:1;min-width:0}
.player-box{background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.player-box iframe{width:100%;height:100%;border:none}
.watch-title{font-size:20px;font-weight:700;margin:16px 0 10px;line-height:1.35}
.watch-actions-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.watch-channel{display:flex;align-items:center;gap:12px}
.channel-name{font-size:15px;font-weight:500}
.action-group{display:flex;gap:8px;flex-wrap:wrap}
.pill-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--bg3);border:none;border-radius:20px;color:var(--text);font-size:14px;font-weight:500}
.pill-btn:hover{background:var(--bg4)}.pill-btn.liked{background:var(--red);color:#fff}
.watch-secondary{width:402px;flex-shrink:0}
.related-item{display:flex;gap:8px;margin-bottom:10px;cursor:pointer}
.related-item .thumb-wrap{width:168px;flex-shrink:0;border-radius:8px}
.related-item .video-title{font-size:13px}.related-item .video-channel{font-size:12px}
.skeleton{position:relative;overflow:hidden;background:var(--bg3);border-radius:var(--radius)}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(24px);background:#2a2a2a;padding:12px 26px;border-radius:24px;font-size:14px;z-index:500;opacity:0;transition:.35s;pointer-events:none;border:1px solid rgba(255,255,255,.08);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.error-box{text-align:center;padding:60px 20px;color:var(--text2);grid-column:1/-1}
.error-box .big{font-size:48px;margin-bottom:12px}
@media(max-width:1200px){.watch-secondary{width:340px}.related-item .thumb-wrap{width:150px}}
@media(max-width:1000px){.sidebar{position:fixed;left:0;z-index:190;transform:translateX(-100%);background:var(--bg)}.sidebar.open{transform:translateX(0);box-shadow:0 0 60px rgba(0,0,0,.7)}.watch-layout{flex-direction:column}.watch-secondary{width:100%}}
@media(max-width:640px){.logo-text{display:none}.main-content{padding:14px}.videos-grid{grid-template-columns:1fr}.watch-title{font-size:17px}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header class="header">
  <div class="header-left">
    <button class="menu-btn" onclick="toggleSidebar()" title="Menu">☰</button>
    <div class="logo" onclick="goHome()"><div class="logo-icon">▶</div><div class="logo-text">Negxus<b>Tube</b></div></div>
  </div>
  <div class="header-center"><div class="search-bar">
    <input type="text" id="searchInput" placeholder="Cole um link do YouTube" onkeypress="if(event.key==='Enter')go()"/>
    <button class="search-btn" onclick="go()" title="Abrir">▶</button>
  </div></div>
  <div class="header-right"><button class="avatar-btn" title="Você">N</button></div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="nav-section">
      <div class="side-item active" data-page="home" onclick="goHome()"><span class="ico">🏠</span><span class="side-label">Início</span></div>
    </div>
    <div class="nav-section">
      <div class="side-item" onclick="openLocal('history')"><span class="ico">🕒</span><span class="side-label">Histórico</span></div>
      <div class="side-item" onclick="openLocal('later')"><span class="ico">📋</span><span class="side-label">Assistir mais tarde</span></div>
      <div class="side-item" onclick="openLocal('liked')"><span class="ico">👍</span><span class="side-label">Vídeos marcados</span></div>
    </div>
  </aside>
  <main class="main-content" id="mainContent"></main>
</div>

<script>
/* Sem API e sem proxy: player oficial (youtube-nocookie), miniaturas do i.ytimg.com e título/canal via oEmbed. */
const SEED=['dQw4w9WgXcQ','jNQXAC9IHJI','9bZkp7q19f0','kJQP7kiw5Fk','fJ9rUzIMcZQ','JGwWNGJdvx8','OPf0YbXqDm0','RgKAFK5djSk','60ItHLz5WEA','CevxZvSJLk8'];
const store={
  get(k,d){try{const v=JSON.parse(localStorage.getItem('nt2_'+k));return v==null?d:v}catch(_){return d}},
  set(k,v){try{localStorage.setItem('nt2_'+k,JSON.stringify(v))}catch(_){}}
};
const meta={...store.get('meta',{})};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(m,d=2800){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),d)}
function parseId(s){
  s=(s||'').trim();
  if(/^[\w-]{11}$/.test(s))return s;
  const m=s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m?m[1]:null;
}
async function getMeta(id){
  if(meta[id])return meta[id];
  try{
    const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
    if(!r.ok)throw 0;
    const d=await r.json();
    meta[id]={title:d.title,author:d.author_name};
    store.set('meta',meta);
    return meta[id];
  }catch(_){return {title:'Vídeo '+id,author:'YouTube'}}
}
const thumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const avatar=(n,s=36)=>`<div class="channel-avatar" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px">${esc((n||'?')[0].toUpperCase())}</div>`;
function setNav(p){document.querySelectorAll('.side-item[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===p))}
function closeSidebarMobile(){if(innerWidth<=1000)document.getElementById('sidebar').classList.remove('open')}
function toggleSidebar(){const sb=document.getElementById('sidebar');innerWidth<=1000?sb.classList.toggle('open'):sb.classList.toggle('collapsed')}

/* cards: renderiza na hora e preenche título/canal quando o oEmbed responde */
function cardHTML(id){
  const m=meta[id];
  return `<div class="video-card" onclick="openVideo('${id}')">
    <div class="thumb-wrap"><img src="${thumb(id)}" loading="lazy"/></div>
    <div class="video-meta"><span data-av="${id}">${avatar(m&&m.author)}</span><div class="video-info">
      <div class="video-title" data-t="${id}">${esc(m?m.title:'Carregando...')}</div>
      <div class="video-channel" data-a="${id}">${esc(m?m.author:'')}</div></div></div></div>`;
}
function fillMeta(ids){
  ids.forEach(async id=>{
    const m=await getMeta(id);
    document.querySelectorAll(`[data-t="${id}"]`).forEach(e=>e.textContent=m.title);
    document.querySelectorAll(`[data-a="${id}"]`).forEach(e=>e.textContent=m.author);
    document.querySelectorAll(`[data-av="${id}"]`).forEach(e=>e.innerHTML=avatar(m.author));
  });
}
function grid(ids,empty){
  return ids.length?`<div class="videos-grid">${ids.map(cardHTML).join('')}</div>`:`<div class="error-box"><div class="big">📭</div>${empty}</div>`;
}

/* ===== PÁGINAS ===== */
function goHome(){
  setNav('home');closeSidebarMobile();
  const hist=store.get('history',[]).slice(0,12);
  const rest=SEED.filter(i=>!hist.includes(i));
  document.getElementById('mainContent').innerHTML=
    `<div class="hint"><b>Cole o link de qualquer vídeo do YouTube</b> na barra acima e aperte Enter para assistir. Sem API, o YouTube não permite busca por texto aqui, então o início mostra seus vídeos recentes e algumas sugestões.</div>`+
    (hist.length?`<h2 class="page-title">Assistidos recentemente</h2>${grid(hist)}<h2 class="page-title" style="margin-top:28px">Sugestões</h2>`:'<h2 class="page-title">Sugestões</h2>')+
    grid(rest);
  fillMeta([...hist,...rest]);
}
function go(){
  const v=document.getElementById('searchInput').value;
  const id=parseId(v);
  if(id){document.getElementById('searchInput').value='';openVideo(id)}
  else showToast('Cole um link ou ID de vídeo do YouTube. Busca por texto precisa de API.');
}
async function openVideo(id){
  setNav('');closeSidebarMobile();scrollTo({top:0});
  const m=await getMeta(id);
  const h=store.get('history',[]).filter(x=>x!==id);h.unshift(id);store.set('history',h.slice(0,80));
  const liked=store.get('liked',[]).includes(id),later=store.get('later',[]).includes(id);
  const rel=[...h.slice(0,6),...SEED].filter((x,i,a)=>x!==id&&a.indexOf(x)===i).slice(0,10);
  document.getElementById('mainContent').innerHTML=`
  <div class="watch-layout"><div class="watch-primary">
    <div class="player-box"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
    <h1 class="watch-title">${esc(m.title)}</h1>
    <div class="watch-actions-row">
      <div class="watch-channel">${avatar(m.author,42)}<span class="channel-name">${esc(m.author)}</span></div>
      <div class="action-group">
        <button class="pill-btn ${liked?'liked':''}" id="likeBtn" onclick="tog('liked','${id}','likeBtn','👍 Gostei','👍 Gostei')">👍 Gostei</button>
        <button class="pill-btn" onclick="share('${id}')">📤 Compartilhar</button>
        <button class="pill-btn ${later?'liked':''}" id="wlBtn" onclick="tog('later','${id}','wlBtn','📋 Salvo','📋 Mais tarde')">${later?'📋 Salvo':'📋 Mais tarde'}</button>
      </div>
    </div>
  </div>
  <div class="watch-secondary">${rel.map(r=>`<div class="related-item" onclick="openVideo('${r}')">
    <div class="thumb-wrap"><img src="${thumb(r)}" loading="lazy"/></div>
    <div class="video-info"><div class="video-title" data-t="${r}">${esc(meta[r]?meta[r].title:'Carregando...')}</div><div class="video-channel" data-a="${r}">${esc(meta[r]?meta[r].author:'')}</div></div></div>`).join('')}</div></div>`;
  fillMeta(rel);
}
function tog(key,id,btn,on,off){
  const l=store.get(key,[]),i=l.indexOf(id);i>-1?l.splice(i,1):l.push(id);store.set(key,l);
  const b=document.getElementById(btn),a=i===-1;b.classList.toggle('liked',a);b.textContent=a?on:off;
  showToast(a?'Adicionado':'Removido');
}
function share(id){const u='https://youtu.be/'+id;navigator.clipboard?navigator.clipboard.writeText(u).then(()=>showToast('📤 Link copiado!')):showToast(u)}
function openLocal(kind){
  setNav('');closeSidebarMobile();
  const t={history:'🕒 Histórico',later:'📋 Assistir mais tarde',liked:'👍 Vídeos marcados'}[kind];
  const ids=store.get(kind,[]);
  document.getElementById('mainContent').innerHTML=`<h2 class="page-title">${t}</h2>`+grid(ids,'Nada por aqui ainda.');
  fillMeta(ids);
}
addEventListener('hashchange',route);
function route(){const m=location.hash.match(/^#\/([\w-]{11})$/);m?openVideo(m[1]):goHome()}
route();
</script>
</body>
</html>
