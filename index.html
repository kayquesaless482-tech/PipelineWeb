<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PipeFlix Player</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           ESTILOS – TEMA NEON ESCURO
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0b0b0b;
            color: #f0f0f0;
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #141414;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff2d55, #ff0a0a);
            border-radius: 10px;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(11, 11, 11, 0.92);
            backdrop-filter: blur(24px);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }

        .logo {
            font-weight: 900;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }
        .logo .icon {
            background: linear-gradient(135deg, #ff2d55, #ff0a0a);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.3);
        }
        .logo span {
            color: #fff;
            font-weight: 700;
        }
        .logo .highlight {
            color: #ff2d55;
        }

        .url-input-wrapper {
            flex: 1;
            display: flex;
            min-width: 280px;
            background: #181818;
            border-radius: 40px;
            overflow: hidden;
            border: 1.5px solid #282828;
            transition: all 0.3s ease;
        }
        .url-input-wrapper:focus-within {
            border-color: #ff2d55;
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.15);
        }
        .url-input-wrapper input {
            flex: 1;
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .url-input-wrapper input::placeholder {
            color: #555;
        }
        .url-input-wrapper button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #ff2d55, #ff0a0a);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .url-input-wrapper button:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions .btn {
            padding: 10px 20px;
            background: transparent;
            border: 1.5px solid #333;
            color: #aaa;
            border-radius: 40px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .header-actions .btn:hover {
            background: #1a1a1a;
            border-color: #555;
            color: #fff;
        }

        /* ===== LAYOUT ===== */
        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 28px;
            gap: 28px;
        }

        /* ===== PLAYER ===== */
        .player-section {
            flex: 1;
            min-width: 0;
        }

        .player-wrapper {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            margin-top: 20px;
            padding: 16px 20px;
            background: #121212;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .video-info .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .video-info .channel {
            font-size: 15px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .video-info .channel .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff2d55, #ff0a0a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }
        .video-info .actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .video-info .actions button {
            padding: 8px 18px;
            background: #1a1a1a;
            border: none;
            border-radius: 30px;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .video-info .actions button:hover {
            background: #282828;
            color: #fff;
        }
        .video-info .actions button.active {
            background: rgba(255, 45, 85, 0.15);
            color: #ff2d55;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 300px;
            flex-shrink: 0;
        }

        .sidebar-section {
            background: #121212;
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .sidebar-section .title {
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .history-item {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
            padding: 10px 8px;
        }
        .history-item:hover {
            background: #1a1a1a;
        }
        .history-item img {
            width: 80px;
            height: 45px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .history-item .info {
            flex: 1;
            min-width: 0;
        }
        .history-item .info .h-title {
            font-size: 13px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .history-item .info .h-channel {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }
        .history-item .remove {
            background: none;
            border: none;
            color: #444;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .history-item .remove:hover {
            color: #ff2d55;
        }

        .empty-state {
            color: #444;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a1a1a;
            color: #f0f0f0;
            padding: 14px 32px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .sidebar-section {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .sidebar-section .title {
                grid-column: 1 / -1;
            }
            .history-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .history-item img {
                width: 100%;
                height: auto;
                aspect-ratio: 16/9;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 10px 16px;
                gap: 12px;
            }
            .logo {
                font-size: 20px;
            }
            .logo .icon {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
            .url-input-wrapper {
                min-width: 100%;
                flex: 1 1 100%;
                order: 3;
            }
            .url-input-wrapper input {
                padding: 10px 16px;
                font-size: 14px;
            }
            .url-input-wrapper button {
                padding: 10px 18px;
                font-size: 13px;
            }
            .container {
                padding: 12px 16px;
                gap: 16px;
            }
            .video-info .title {
                font-size: 17px;
            }
            .sidebar-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .header-actions .btn {
                font-size: 11px;
                padding: 6px 12px;
            }
            .video-info {
                padding: 12px 14px;
            }
            .video-info .actions button {
                font-size: 12px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo" onclick="goHome()">
            <span class="icon">▶</span>
            <span>Pipe</span><span class="highlight">Flix</span>
        </div>
        <div class="url-input-wrapper">
            <input type="text" id="urlInput" placeholder="Cole a URL do YouTube..." onkeypress="if(event.key==='Enter') loadVideo()" />
            <button onclick="loadVideo()">Assistir</button>
        </div>
        <div class="header-actions">
            <button class="btn" onclick="clearHistory()">🗑️ Limpar</button>
        </div>
    </header>

    <!-- CONTAINER -->
    <div class="container">
        <!-- PLAYER -->
        <div class="player-section">
            <div class="player-wrapper" id="playerWrapper">
                <iframe id="playerIframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="video-info" id="videoInfo">
                <div class="title" id="videoTitle">Nenhum vídeo carregado</div>
                <div class="channel" id="videoChannel">
                    <span class="avatar" id="channelAvatar">?</span>
                    <span id="channelName">—</span>
                </div>
                <div class="actions">
                    <button onclick="saveToWatchLater()" id="btnWatchLater">⏰ Assistir mais tarde</button>
                    <button onclick="saveToDownloaded()" id="btnDownloaded">⬇️ Baixar</button>
                    <button onclick="shareVideo()">📤 Compartilhar</button>
                </div>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <!-- Histórico -->
            <div class="sidebar-section">
                <div class="title">📺 Histórico</div>
                <div id="historyList"></div>
            </div>
            <!-- Assistir mais tarde -->
            <div class="sidebar-section">
                <div class="title">⏰ Assistir mais tarde</div>
                <div id="watchLaterList"></div>
            </div>
            <!-- Baixados -->
            <div class="sidebar-section">
                <div class="title">⬇️ Baixados</div>
                <div id="downloadedList"></div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  PIPEFLIX PLAYER – ASSISTA VIA URL
        // ================================================================

        // ===== ESTADO =====
        let state = {
            currentVideoId: null,
            currentData: null, // { title, channel, thumbnail, videoId }
            history: [], // array de { videoId, title, channel, thumbnail }
            watchLater: [], // array de videoId
            downloaded: [] // array de videoId
        };

        // ===== CARREGAR DADOS DO LOCALSTORAGE =====
        function loadState() {
            try {
                const raw = localStorage.getItem('pipeflix_player_data');
                if (raw) {
                    const data = JSON.parse(raw);
                    state.history = data.history || [];
                    state.watchLater = data.watchLater || [];
                    state.downloaded = data.downloaded || [];
                }
            } catch (_) {}
            renderSidebars();
        }

        function saveState() {
            try {
                localStorage.setItem('pipeflix_player_data', JSON.stringify({
                    history: state.history,
                    watchLater: state.watchLater,
                    downloaded: state.downloaded
                }));
            } catch (_) {}
        }

        // ===== TOAST =====
        function showToast(msg, duration = 3000) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), duration);
        }

        // ===== EXTRAIR ID DO YOUTUBE =====
        function extractVideoId(url) {
            if (!url) return null;
            // Exemplos:
            // https://www.youtube.com/watch?v=abc123
            // https://youtu.be/abc123
            // https://www.youtube.com/embed/abc123
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
            ];
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        // ===== CARREGAR VÍDEO =====
        async function loadVideo(url) {
            const input = document.getElementById('urlInput');
            const videoUrl = url || input.value.trim();
            if (!videoUrl) {
                showToast('Digite ou cole uma URL do YouTube');
                return;
            }

            const videoId = extractVideoId(videoUrl);
            if (!videoId) {
                showToast('❌ URL inválida. Use um link do YouTube.');
                return;
            }

            // Atualiza o player
            const iframe = document.getElementById('playerIframe');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&showinfo=0&controls=1&enablejsapi=1`;

            state.currentVideoId = videoId;

            // Buscar informações via oEmbed
            try {
                const oembedUrl = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`;
                const response = await fetch(oembedUrl);
                if (response.ok) {
                    const data = await response.json();
                    state.currentData = {
                        videoId: videoId,
                        title: data.title || 'Sem título',
                        channel: data.author_name || 'Desconhecido',
                        thumbnail: data.thumbnail_url || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
                    };
                    updateVideoInfo(state.currentData);

                    // Adiciona ao histórico
                    addToHistory(state.currentData);
                } else {
                    // Fallback: dados mínimos
                    state.currentData = {
                        videoId: videoId,
                        title: 'Vídeo do YouTube',
                        channel: 'Canal',
                        thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
                    };
                    updateVideoInfo(state.currentData);
                    addToHistory(state.currentData);
                }
            } catch (_) {
                state.currentData = {
                    videoId: videoId,
                    title: 'Vídeo do YouTube',
                    channel: 'Canal',
                    thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
                };
                updateVideoInfo(state.currentData);
                addToHistory(state.currentData);
            }

            // Limpar campo
            input.value = '';
        }

        // ===== ATUALIZAR INFORMAÇÕES DO VÍDEO =====
        function updateVideoInfo(data) {
            document.getElementById('videoTitle').textContent = data.title;
            document.getElementById('channelName').textContent = data.channel;
            document.getElementById('channelAvatar').textContent = data.channel.charAt(0).toUpperCase();

            // Atualizar botões de estado
            const isWatchLater = state.watchLater.includes(data.videoId);
            const btnWL = document.getElementById('btnWatchLater');
            btnWL.textContent = isWatchLater ? '⏰ Salvo' : '⏰ Assistir mais tarde';
            btnWL.className = isWatchLater ? 'active' : '';

            const isDownloaded = state.downloaded.includes(data.videoId);
            const btnD = document.getElementById('btnDownloaded');
            btnD.textContent = isDownloaded ? '⬇️ Baixado' : '⬇️ Baixar';
            btnD.className = isDownloaded ? 'active' : '';
        }

        // ===== HISTÓRICO =====
        function addToHistory(data) {
            // Remove se já existir
            state.history = state.history.filter(item => item.videoId !== data.videoId);
            state.history.unshift(data); // adiciona no topo
            // Limita a 50 itens
            if (state.history.length > 50) state.history.pop();
            saveState();
            renderSidebars();
        }

        function clearHistory() {
            if (state.history.length === 0) {
                showToast('Histórico já está vazio');
                return;
            }
            if (confirm('Tem certeza que deseja limpar todo o histórico?')) {
                state.history = [];
                saveState();
                renderSidebars();
                showToast('🗑️ Histórico limpo');
            }
        }

        function removeFromHistory(videoId) {
            state.history = state.history.filter(item => item.videoId !== videoId);
            saveState();
            renderSidebars();
            showToast('Removido do histórico');
        }

        // ===== ASSISTIR MAIS TARDE =====
        function saveToWatchLater() {
            if (!state.currentData) {
                showToast('Carregue um vídeo primeiro');
                return;
            }
            const id = state.currentData.videoId;
            const idx = state.watchLater.indexOf(id);
            if (idx > -1) {
                state.watchLater.splice(idx, 1);
                showToast('Removido de "Assistir mais tarde"');
            } else {
                state.watchLater.push(id);
                showToast('⏰ Adicionado a "Assistir mais tarde"');
            }
            saveState();
            renderSidebars();
            updateVideoInfo(state.currentData);
        }

        function removeWatchLater(videoId) {
            state.watchLater = state.watchLater.filter(id => id !== videoId);
            saveState();
            renderSidebars();
            if (state.currentData && state.currentData.videoId === videoId) {
                updateVideoInfo(state.currentData);
            }
            showToast('Removido de "Assistir mais tarde"');
        }

        // ===== BAIXADOS =====
        function saveToDownloaded() {
            if (!state.currentData) {
                showToast('Carregue um vídeo primeiro');
                return;
            }
            const id = state.currentData.videoId;
            const idx = state.downloaded.indexOf(id);
            if (idx > -1) {
                state.downloaded.splice(idx, 1);
                showToast('Download removido');
            } else {
                state.downloaded.push(id);
                showToast('⬇️ Vídeo marcado como baixado');
            }
            saveState();
            renderSidebars();
            updateVideoInfo(state.currentData);
        }

        function removeDownloaded(videoId) {
            state.downloaded = state.downloaded.filter(id => id !== videoId);
            saveState();
            renderSidebars();
            if (state.currentData && state.currentData.videoId === videoId) {
                updateVideoInfo(state.currentData);
            }
            showToast('Removido da lista de baixados');
        }

        // ===== COMPARTILHAR =====
        function shareVideo() {
            if (!state.currentVideoId) {
                showToast('Nenhum vídeo carregado');
                return;
            }
            const url = `https://www.youtube.com/watch?v=${state.currentVideoId}`;
            if (navigator.share) {
                navigator.share({ title: state.currentData?.title || 'Vídeo', url: url })
                    .catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('📤 Link copiado para a área de transferência!');
                }).catch(() => {
                    // fallback
                    prompt('Copie o link:', url);
                });
            }
        }

        // ===== RENDERIZAR SIDEBARS =====
        function renderSidebars() {
            renderHistory();
            renderWatchLaterList();
            renderDownloadedList();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            if (state.history.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum vídeo assistido</div>';
                return;
            }
            container.innerHTML = state.history.map(item => `
                <div class="history-item" onclick="playFromHistory('${item.videoId}')">
                    <img src="${item.thumbnail}" alt="${item.title}" loading="lazy" />
                    <div class="info">
                        <div class="h-title">${item.title}</div>
                        <div class="h-channel">${item.channel}</div>
                    </div>
                    <button class="remove" onclick="event.stopPropagation();removeFromHistory('${item.videoId}')">✕</button>
                </div>
            `).join('');
        }

        function renderWatchLaterList() {
            const container = document.getElementById('watchLaterList');
            const items = state.history.filter(item => state.watchLater.includes(item.videoId));
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum vídeo salvo</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="history-item" onclick="playFromHistory('${item.videoId}')">
                    <img src="${item.thumbnail}" alt="${item.title}" loading="lazy" />
                    <div class="info">
                        <div class="h-title">${item.title}</div>
                        <div class="h-channel">${item.channel}</div>
                    </div>
                    <button class="remove" onclick="event.stopPropagation();removeWatchLater('${item.videoId}')">✕</button>
                </div>
            `).join('');
        }

        function renderDownloadedList() {
            const container = document.getElementById('downloadedList');
            const items = state.history.filter(item => state.downloaded.includes(item.videoId));
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum vídeo baixado</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="history-item" onclick="playFromHistory('${item.videoId}')">
                    <img src="${item.thumbnail}" alt="${item.title}" loading="lazy" />
                    <div class="info">
                        <div class="h-title">${item.title}</div>
                        <div class="h-channel">${item.channel}</div>
                    </div>
                    <button class="remove" onclick="event.stopPropagation();removeDownloaded('${item.videoId}')">✕</button>
                </div>
            `).join('');
        }

        function playFromHistory(videoId) {
            // Carrega o vídeo sem precisar de URL
            const iframe = document.getElementById('playerIframe');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&showinfo=0&controls=1&enablejsapi=1`;
            state.currentVideoId = videoId;

            // Buscar dados do histórico ou do oEmbed
            const item = state.history.find(h => h.videoId === videoId);
            if (item) {
                state.currentData = item;
                updateVideoInfo(item);
                // Re-adiciona ao topo do histórico (move)
                state.history = state.history.filter(h => h.videoId !== videoId);
                state.history.unshift(item);
                saveState();
                renderSidebars();
            } else {
                // Fallback: busca oEmbed
                fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`)
                    .then(res => res.json())
                    .then(data => {
                        const newData = {
                            videoId: videoId,
                            title: data.title || 'Vídeo',
                            channel: data.author_name || 'Canal',
                            thumbnail: data.thumbnail_url || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
                        };
                        state.currentData = newData;
                        updateVideoInfo(newData);
                        addToHistory(newData);
                    })
                    .catch(() => {
                        // dados mínimos
                        const fallbackData = {
                            videoId: videoId,
                            title: 'Vídeo do YouTube',
                            channel: 'Canal',
                            thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
                        };
                        state.currentData = fallbackData;
                        updateVideoInfo(fallbackData);
                        addToHistory(fallbackData);
                    });
            }
            document.getElementById('urlInput').value = '';
        }

        // ===== GO HOME (limpa player) =====
        function goHome() {
            const iframe = document.getElementById('playerIframe');
            iframe.src = '';
            state.currentVideoId = null;
            state.currentData = null;
            document.getElementById('videoTitle').textContent = 'Nenhum vídeo carregado';
            document.getElementById('channelName').textContent = '—';
            document.getElementById('channelAvatar').textContent = '?';
            document.getElementById('btnWatchLater').textContent = '⏰ Assistir mais tarde';
            document.getElementById('btnWatchLater').className = '';
            document.getElementById('btnDownloaded').textContent = '⬇️ Baixar';
            document.getElementById('btnDownloaded').className = '';
            document.getElementById('urlInput').value = '';
        }

        // ===== INICIAR =====
        loadState();

        // Se houver algum vídeo no histórico, carrega o primeiro
        if (state.history.length > 0) {
            // Mas não autoplay, apenas deixa o player vazio.
        }

        // ===== TRATAR URL VIA PARÂMETRO ?v= =====
        (function() {
            const params = new URLSearchParams(window.location.search);
            const v = params.get('v');
            if (v) {
                // Preenche o input e carrega
                document.getElementById('urlInput').value = `https://www.youtube.com/watch?v=${v}`;
                loadVideo();
            }
        })();

        // Suporte para colar URL e carregar automaticamente (opcional)
        document.getElementById('urlInput').addEventListener('paste', function(e) {
            // pequeno atraso para garantir que o valor foi colado
            setTimeout(() => {
                const val = this.value.trim();
                if (val && extractVideoId(val)) {
                    loadVideo(val);
                }
            }, 100);
        });

        console.log('🎬 PipeFlix Player carregado! Cole uma URL do YouTube e assista.');
    </script>
</body>
</html>
