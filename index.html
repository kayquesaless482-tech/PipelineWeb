<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Web - Player Alternativo</title>
    
    <!-- Video.js - Player alternativo -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        /* HEADER */
        .header {
            background: #1a1a1a;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #2a2a2a;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 800;
            font-size: 22px;
            color: #ff0000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .logo span { color: #fff; font-weight: 400; }
        .logo small { font-size: 11px; color: #888; font-weight: 300; }

        .search-box {
            flex: 1;
            max-width: 500px;
            display: flex;
            min-width: 150px;
            background: #222;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .search-box:focus-within { border-color: #555; }
        .search-box input {
            flex: 1;
            padding: 10px 18px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box input::placeholder { color: #888; }
        .search-box button {
            padding: 10px 18px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s;
        }
        .search-box button:hover { color: #fff; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }
        .header-actions .btn {
            padding: 8px 16px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .header-actions .btn:hover { background: #cc0000; }
        .header-actions .btn-outline {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
        }
        .header-actions .btn-outline:hover { background: #222; border-color: #666; }

        /* CONTAINER */
        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            padding: 12px 8px;
            position: sticky;
            top: 60px;
            height: calc(100vh - 60px);
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid #2a2a2a;
        }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-section .title {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            padding: 8px 16px;
            letter-spacing: 0.5px;
        }
        .sidebar-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 10px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }
        .sidebar-item:hover { background: #272727; color: #fff; }
        .sidebar-item.active { background: #272727; color: #fff; font-weight: 600; }
        .sidebar-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .sidebar-item .badge {
            margin-left: auto;
            background: #333;
            color: #888;
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
        }

        /* MAIN */
        .main-content {
            flex: 1;
            padding: 20px 24px;
            min-width: 0;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-title { font-size: 20px; font-weight: 700; }
        .section-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .section-actions .filter-btn {
            padding: 6px 14px;
            background: #222;
            border: 1px solid #333;
            border-radius: 16px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .section-actions .filter-btn:hover { background: #333; color: #fff; }
        .section-actions .filter-btn.active {
            background: #ff000022;
            border-color: #ff0000;
            color: #ff0000;
        }

        /* VIDEO GRID */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .video-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .video-card .thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            position: relative;
            overflow: hidden;
        }
        .video-card .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-card .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .video-card .info { padding: 12px 14px; }
        .video-card .title {
            font-weight: 600;
            font-size: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
            margin-bottom: 4px;
        }
        .video-card .channel { font-size: 12px; color: #888; }
        .video-card .meta {
            font-size: 12px;
            color: #666;
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .video-card .actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #2a2a2a;
        }
        .video-card .actions button {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 12px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .video-card .actions button:hover { background: #272727; color: #fff; }
        .video-card .actions button.saved { color: #ff0000; }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #222;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .no-results { text-align: center; padding: 60px 20px; color: #666; }
        .no-results .emoji { font-size: 48px; margin-bottom: 16px; }

        /* PLAYER OVERLAY - COM VIDEO.JS */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-overlay.active { display: flex; }

        .player-container {
            background: #1a1a1a;
            border-radius: 16px;
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .player-header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        .player-header h2 {
            font-size: 15px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 16px;
        }
        .player-header .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 26px;
            cursor: pointer;
            padding: 0 8px;
            line-height: 1;
        }
        .player-header .close-btn:hover { color: #fff; }

        .player-body {
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            flex: 1;
        }

        .player-wrapper {
            flex: 1;
            min-width: 300px;
            min-height: 300px;
            background: #000;
            position: relative;
        }
        .player-wrapper video {
            width: 100%;
            height: 100%;
            min-height: 300px;
        }
        /* Estilos do Video.js no dark mode */
        .video-js {
            width: 100%;
            height: 100%;
            min-height: 300px;
        }
        .vjs-theme-fantasy .vjs-big-play-button {
            background: rgba(255,0,0,0.7);
            border-radius: 50%;
        }

        .player-sidebar {
            width: 320px;
            padding: 16px 20px;
            overflow-y: auto;
            background: #161616;
            flex-shrink: 0;
            max-height: 500px;
        }
        .player-sidebar .video-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .player-sidebar .video-meta { font-size: 13px; color: #888; margin-bottom: 12px; }
        .player-sidebar .channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid #2a2a2a;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px;
        }
        .player-sidebar .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }
        .player-sidebar .channel-name { font-weight: 600; font-size: 14px; }
        .player-sidebar .channel-subs { font-size: 12px; color: #888; }
        .player-sidebar .description {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
            max-height: 80px;
            overflow-y: auto;
            margin-bottom: 12px;
            background: #111;
            padding: 10px;
            border-radius: 8px;
        }
        .player-sidebar .actions-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .player-sidebar .actions-row button {
            padding: 6px 14px;
            background: #272727;
            border: none;
            border-radius: 16px;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }
        .player-sidebar .actions-row button:hover { background: #333; color: #fff; }
        .player-sidebar .actions-row button.liked { color: #ff0000; }
        .player-sidebar .actions-row button.saved { color: #ff0000; }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            border: 1px solid #333;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .player-sidebar { width: 100%; max-height: 300px; }
            .header { padding: 8px 12px; gap: 10px; }
            .logo { font-size: 18px; }
            .search-box { max-width: 100%; flex: 1 1 100%; order: 3; }
            .main-content { padding: 12px; }
            .player-overlay { padding: 0; }
            .player-container { max-height: 100vh; border-radius: 0; }
            .player-wrapper video { min-height: 200px; }
        }
        @media (max-width: 480px) {
            .video-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .video-card .info { padding: 8px 10px; }
            .video-card .title { font-size: 12px; }
            .section-title { font-size: 17px; }
        }
    </style>
</head>
<body>
    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo" onclick="goHome()">▶ <span>Pipeline</span> <small>Web</small></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar vídeos..." onkeypress="if(event.key==='Enter') searchVideos()">
            <button onclick="searchVideos()">🔍</button>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="importSubscriptions()">📥 Importar</button>
            <button class="btn" onclick="loginUser()" id="loginBtn">Entrar</button>
        </div>
    </header>

    <!-- CONTAINER -->
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="title">Menu</div>
                <div class="sidebar-item active" onclick="setActive(this, 'feed')">
                    <span class="icon">📺</span> Feed <span class="badge" id="feedCount">0</span>
                </div>
                <div class="sidebar-item" onclick="setActive(this, 'subscriptions')">
                    <span class="icon">📋</span> Inscrições
                </div>
                <div class="sidebar-item" onclick="setActive(this, 'watchlater')">
                    <span class="icon">⏰</span> Assistir mais tarde <span class="badge" id="wlCount">0</span>
                </div>
                <div class="sidebar-item" onclick="setActive(this, 'downloaded')">
                    <span class="icon">⬇️</span> Baixados
                </div>
            </div>
            <div class="sidebar-section">
                <div class="title">Filtros</div>
                <div class="sidebar-item" onclick="toggleFilter(this, 'shorts')">
                    <span class="icon">🚫</span> Ocultar Shorts
                </div>
                <div class="sidebar-item" onclick="toggleFilter(this, 'watched')">
                    <span class="icon">👁️</span> Ocultar Assistidos
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="section-header">
                <h1 class="section-title" id="sectionTitle">📺 Feed</h1>
                <div class="section-actions" id="sectionActions">
                    <button class="filter-btn active" onclick="setFilter(this, 'all')">Todos</button>
                    <button class="filter-btn" onclick="setFilter(this, 'recent')">Recentes</button>
                    <button class="filter-btn" onclick="setFilter(this, 'popular')">Populares</button>
                </div>
            </div>
            <div id="videoGrid" class="video-grid"></div>
            <div id="loadingIndicator" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>Carregando vídeos...</p>
            </div>
            <div id="noResults" class="no-results" style="display:none;">
                <div class="emoji">📭</div>
                <p>Nenhum vídeo encontrado</p>
            </div>
        </main>
    </div>

    <!-- PLAYER OVERLAY -->
    <div class="player-overlay" id="playerOverlay">
        <div class="player-container">
            <div class="player-header">
                <h2 id="playerTitle">Vídeo</h2>
                <button class="close-btn" onclick="closePlayer()">✕</button>
            </div>
            <div class="player-body">
                <div class="player-wrapper" id="playerWrapper">
                    <video id="myPlayer" class="video-js vjs-theme-fantasy" controls preload="auto" data-setup='{}'>
                        <p class="vjs-no-js">Seu navegador não suporta vídeo.</p>
                    </video>
                </div>
                <div class="player-sidebar" id="playerSidebar">
                    <div class="video-title" id="pTitle">Título</div>
                    <div class="video-meta" id="pMeta">0 visualizações</div>
                    <div class="channel-info">
                        <div class="channel-avatar" id="pAvatar">📺</div>
                        <div>
                            <div class="channel-name" id="pChannel">Canal</div>
                            <div class="channel-subs" id="pSubs">0 inscritos</div>
                        </div>
                    </div>
                    <div class="description" id="pDesc">Descrição...</div>
                    <div class="actions-row">
                        <button onclick="togglePlayerLike()" id="pLikeBtn">👍 Curtir</button>
                        <button onclick="togglePlayerSave()" id="pSaveBtn">⏰ Salvar</button>
                        <button onclick="downloadCurrentVideo()" id="pDownloadBtn">⬇️ Baixar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  PIPELINE WEB - COM UNOFFICIAL YOUTUBE API E VIDEO.JS
        // ============================================================

        // ===== CONFIGURAÇÃO =====
        // Use uma instância pública da API ou a sua local
        const API_URL = 'https://unofficial-youtube-api.vercel.app'; // Pública
        // Se quiser rodar local: http://localhost:3000

        const CONFIG = {
            apiBase: API_URL,
            filters: { hideShorts: false, hideWatched: false },
            currentFilter: 'all'
        };

        // ===== ESTADO =====
        let state = {
            user: null,
            subscriptions: [],
            feed: [],
            watchLater: [],
            downloaded: [],
            viewed: [],
            currentVideoId: null,
            currentChannelId: null,
            currentView: 'feed',
            isLoading: false,
            currentVideoData: null // Para o player
        };

        // ===== TOAST =====
        function showToast(msg, duration = 3000) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), duration);
        }

        // ===== DADOS LOCAIS =====
        function loadData() {
            try {
                const raw = localStorage.getItem('pipeline_data');
                if (raw) {
                    const data = JSON.parse(raw);
                    state.subscriptions = data.subscriptions || [];
                    state.watchLater = data.watchLater || [];
                    state.downloaded = data.downloaded || [];
                    state.viewed = data.viewed || [];
                    if (data.user) state.user = data.user;
                    updateUI();
                }
            } catch (e) { console.warn('Erro ao carregar dados:', e); }
        }

        function saveData() {
            try {
                localStorage.setItem('pipeline_data', JSON.stringify({
                    user: state.user,
                    subscriptions: state.subscriptions,
                    watchLater: state.watchLater,
                    downloaded: state.downloaded,
                    viewed: state.viewed
                }));
            } catch (e) { console.warn('Erro ao salvar dados:', e); }
        }

        // ===== USUÁRIO =====
        function loginUser() {
            if (state.user) {
                state.user = null;
                document.getElementById('loginBtn').textContent = 'Entrar';
                saveData();
                showToast('Desconectado');
                return;
            }
            const name = prompt('Digite seu nome:');
            if (name && name.trim()) {
                state.user = { name: name.trim(), id: Date.now().toString(36) };
                document.getElementById('loginBtn').textContent = state.user.name;
                saveData();
                showToast('👋 Bem-vindo, ' + state.user.name + '!');
            }
        }

        // ===== FILTROS =====
        function toggleFilter(el, filter) {
            el.classList.toggle('active');
            if (filter === 'shorts') CONFIG.filters.hideShorts = !CONFIG.filters.hideShorts;
            if (filter === 'watched') CONFIG.filters.hideWatched = !CONFIG.filters.hideWatched;
            renderFeed();
        }

        function setFilter(el, filter) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            CONFIG.currentFilter = filter;
            renderFeed();
        }

        // ===== SIDEBAR =====
        function setActive(el, view) {
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            state.currentView = view;
            document.getElementById('sectionTitle').textContent = 
                view === 'feed' ? '📺 Feed' :
                view === 'subscriptions' ? '📋 Inscrições' :
                view === 'watchlater' ? '⏰ Assistir mais tarde' : '⬇️ Baixados';
            
            if (view === 'feed') loadFeed();
            else if (view === 'subscriptions') renderSubscriptions();
            else if (view === 'watchlater') renderWatchLater();
            else if (view === 'downloaded') renderDownloaded();
        }

        function goHome() {
            const first = document.querySelector('.sidebar-item');
            if (first) setActive(first, 'feed');
        }

        // ===== BUSCAR VÍDEOS COM A API =====
        async function loadFeed(query = '') {
            if (state.isLoading) return;
            state.isLoading = true;
            
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('videoGrid').innerHTML = '';
            document.getElementById('noResults').style.display = 'none';

            try {
                const searchQuery = query || 'programação';
                const url = `${CONFIG.apiBase}/youtube/search?all=${encodeURIComponent(searchQuery)}`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                // A API retorna { status, data: [...] }
                const results = data.data || data.results || data || [];
                
                if (!results || results.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                    document.getElementById('loadingIndicator').style.display = 'none';
                    state.isLoading = false;
                    return;
                }

                state.feed = results.map(v => ({
                    id: v.videoId || v.id || v.video_id,
                    title: v.title || 'Sem título',
                    channel: v.channelTitle || v.channel || v.author || 'Desconhecido',
                    channelId: v.channelId || v.channel_id || '',
                    thumb: v.thumbnail || v.thumbnails?.[0]?.url || `https://img.youtube.com/vi/${v.videoId || v.id}/hqdefault.jpg`,
                    views: parseInt(v.viewCount || v.views || 0),
                    duration: parseDuration(v.duration || v.length || '0:00'),
                    published: v.publishedAt || v.published || Date.now() / 1000,
                    isShort: (v.duration && v.duration.includes('PT') && v.duration.includes('S') && parseDuration(v.duration) < 60) || false,
                    watched: state.viewed.includes(v.videoId || v.id)
                }));

                document.getElementById('feedCount').textContent = state.feed.length;
                renderFeed();

            } catch (err) {
                console.warn('Erro ao carregar feed:', err);
                showToast('❌ Erro ao carregar: ' + err.message);
                loadFallbackFeed();
            }

            document.getElementById('loadingIndicator').style.display = 'none';
            state.isLoading = false;
        }

        // ===== FALLBACK =====
        function loadFallbackFeed() {
            state.feed = [
                { id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up', channel: 'Rick Astley', thumb: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg', views: 1200000000, duration: 213, published: Date.now()/1000 - 86400*365*10, isShort: false, watched: false },
                { id: '9bZkp7q19f0', title: 'Gangnam Style', channel: 'PSY', thumb: 'https://img.youtube.com/vi/9bZkp7q19f0/hqdefault.jpg', views: 4500000000, duration: 252, published: Date.now()/1000 - 86400*365*11, isShort: false, watched: false },
                { id: 'kJQP7kiw5Fk', title: 'Despacito', channel: 'Luis Fonsi', thumb: 'https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg', views: 8000000000, duration: 281, published: Date.now()/1000 - 86400*365*7, isShort: false, watched: false }
            ];
            document.getElementById('feedCount').textContent = state.feed.length;
            renderFeed();
            showToast('📡 Modo offline (fallback)');
        }

        // ===== RENDER FEED =====
        function renderFeed() {
            const grid = document.getElementById('videoGrid');
            let videos = [...state.feed];

            if (CONFIG.filters.hideShorts) videos = videos.filter(v => !v.isShort);
            if (CONFIG.filters.hideWatched) videos = videos.filter(v => !v.watched);

            if (CONFIG.currentFilter === 'recent') {
                videos.sort((a, b) => b.published - a.published);
            } else if (CONFIG.currentFilter === 'popular') {
                videos.sort((a, b) => b.views - a.views);
            }

            if (videos.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                grid.innerHTML = '';
                return;
            }
            document.getElementById('noResults').style.display = 'none';

            const isSubscribed = (channelId) => state.subscriptions.some(s => s.id === channelId);
            const isSaved = (id) => state.watchLater.includes(id);
            const isDownloaded = (id) => state.downloaded.includes(id);

            grid.innerHTML = videos.map(v => `
                <div class="video-card" onclick="playVideo('${v.id}')">
                    <div class="thumbnail">
                        <img src="${v.thumb}" alt="${v.title}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg'">
                        <div class="duration">${formatDuration(v.duration)}</div>
                        ${v.isShort ? '<div style="position:absolute;top:8px;right:8px;background:#ff0000;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;">#Shorts</div>' : ''}
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="channel">${v.channel}</div>
                        <div class="meta">
                            <span>${formatViews(v.views)}</span>
                            <span>•</span>
                            <span>${formatDate(v.published)}</span>
                            ${v.watched ? '<span style="color:#666;">• 👁️</span>' : ''}
                        </div>
                        <div class="actions">
                            <button onclick="event.stopPropagation();toggleSubscribe('${v.channelId}','${v.channel}')" 
                                    style="color:${isSubscribed(v.channelId) ? '#ff0000' : '#666'}">
                                ${isSubscribed(v.channelId) ? '✅' : '➕'} Inscrever
                            </button>
                            <button onclick="event.stopPropagation();toggleSave('${v.id}')" 
                                    class="${isSaved(v.id) ? 'saved' : ''}">
                                ${isSaved(v.id) ? '⏰ Salvo' : '⏰ Salvar'}
                            </button>
                            <button onclick="event.stopPropagation();downloadVideo('${v.id}')">
                                ${isDownloaded(v.id) ? '⬇️ Baixado' : '⬇️'}
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('wlCount').textContent = state.watchLater.length;
        }

        // ===== INSCRIÇÕES =====
        function toggleSubscribe(channelId, channelName) {
            if (!state.user) { showToast('Faça login para se inscrever'); return; }
            if (!channelId) { showToast('ID do canal inválido'); return; }
            const idx = state.subscriptions.findIndex(s => s.id === channelId);
            if (idx > -1) {
                state.subscriptions.splice(idx, 1);
                showToast('Inscrição cancelada: ' + channelName);
            } else {
                state.subscriptions.push({ id: channelId, name: channelName, avatar: channelName.charAt(0) });
                showToast('✅ Inscrito em: ' + channelName);
            }
            saveData();
            renderFeed();
        }

        function renderSubscriptions() {
            const grid = document.getElementById('videoGrid');
            if (state.subscriptions.length === 0) {
                grid.innerHTML = `<div class="no-results"><div class="emoji">📋</div><p>Você ainda não tem inscrições. Pesquise e inscreva-se em canais!</p></div>`;
                return;
            }
            grid.innerHTML = state.subscriptions.map(s => `
                <div class="video-card" style="padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                    <div style="width:60px;height:60px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0;">${s.avatar}</div>
                    <div style="flex:1;">
                        <div style="font-weight:600;font-size:16px;">${s.name}</div>
                        <div style="font-size:13px;color:#888;">ID: ${s.id}</div>
                    </div>
                    <button onclick="unsubscribeChannel('${s.id}')" style="padding:6px 16px;background:#333;border:none;border-radius:16px;color:#ff0000;cursor:pointer;">Cancelar</button>
                </div>
            `).join('');
        }

        function unsubscribeChannel(channelId) {
            state.subscriptions = state.subscriptions.filter(s => s.id !== channelId);
            saveData();
            renderSubscriptions();
            showToast('Inscrição removida');
        }

        // ===== ASSISTIR MAIS TARDE =====
        function toggleSave(videoId) {
            if (!state.user) { showToast('Faça login para salvar'); return; }
            const idx = state.watchLater.indexOf(videoId);
            if (idx > -1) {
                state.watchLater.splice(idx, 1);
                showToast('Removido de "Assistir mais tarde"');
            } else {
                state.watchLater.push(videoId);
                showToast('⏰ Salvo em "Assistir mais tarde"');
            }
            saveData();
            renderFeed();
            document.getElementById('wlCount').textContent = state.watchLater.length;
        }

        function renderWatchLater() {
            const grid = document.getElementById('videoGrid');
            const saved = state.feed.filter(v => state.watchLater.includes(v.id));
            if (saved.length === 0) {
                grid.innerHTML = `<div class="no-results"><div class="emoji">⏰</div><p>Nenhum vídeo salvo para assistir mais tarde</p></div>`;
                return;
            }
            grid.innerHTML = saved.map(v => `
                <div class="video-card" onclick="playVideo('${v.id}')">
                    <div class="thumbnail">
                        <img src="${v.thumb}" alt="${v.title}">
                        <div class="duration">${formatDuration(v.duration)}</div>
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="channel">${v.channel}</div>
                        <div class="meta">${formatViews(v.views)} visualizações</div>
                        <div class="actions">
                            <button onclick="event.stopPropagation();toggleSave('${v.id}')" style="color:#ff0000;">⏰ Remover</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ===== DOWNLOAD =====
        function downloadVideo(videoId) {
            if (!state.user) { showToast('Faça login para baixar'); return; }
            if (state.downloaded.includes(videoId)) {
                state.downloaded = state.downloaded.filter(id => id !== videoId);
                showToast('Download removido');
            } else {
                state.downloaded.push(videoId);
                showToast('⬇️ Vídeo baixado! (offline)');
            }
            saveData();
            renderFeed();
        }

        function downloadCurrentVideo() {
            if (state.currentVideoId) {
                downloadVideo(state.currentVideoId);
                const isDownloaded = state.downloaded.includes(state.currentVideoId);
                document.getElementById('pDownloadBtn').textContent = isDownloaded ? '⬇️ Baixado' : '⬇️ Baixar';
            }
        }

        function renderDownloaded() {
            const grid = document.getElementById('videoGrid');
            const downloaded = state.feed.filter(v => state.downloaded.includes(v.id));
            if (downloaded.length === 0) {
                grid.innerHTML = `<div class="no-results"><div class="emoji">⬇️</div><p>Nenhum vídeo baixado</p></div>`;
                return;
            }
            grid.innerHTML = downloaded.map(v => `
                <div class="video-card" onclick="playVideo('${v.id}')">
                    <div class="thumbnail">
                        <img src="${v.thumb}" alt="${v.title}">
                        <div class="duration">${formatDuration(v.duration)}</div>
                        <div style="position:absolute;top:8px;left:8px;background:#00ff0055;color:#fff;font-size:10px;padding:2px 8px;border-radius:4px;">⬇️ OFFLINE</div>
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="channel">${v.channel}</div>
                    </div>
                </div>
            `).join('');
        }

        // ===== IMPORTAÇÃO =====
        function importSubscriptions() {
            const text = prompt('Cole suas inscrições do NewPipe/YouTube (IDs separados por vírgula):');
            if (!text) return;
            const ids = text.split(',').map(s => s.trim()).filter(s => s);
            let count = 0;
            ids.forEach(id => {
                if (!state.subscriptions.some(s => s.id === id)) {
                    state.subscriptions.push({ id, name: 'Canal ' + id, avatar: id.charAt(0).toUpperCase() });
                    count++;
                }
            });
            saveData();
            showToast(`✅ ${count} inscrições importadas!`);
            renderSubscriptions();
        }

        // ===== PLAYER COM VIDEO.JS =====
        let playerInstance = null;

        function playVideo(videoId) {
            state.currentVideoId = videoId;
            document.getElementById('playerOverlay').classList.add('active');
            document.getElementById('playerTitle').textContent = 'Carregando...';

            // Buscar detalhes do vídeo
            fetchVideoDetails(videoId);
        }

        async function fetchVideoDetails(videoId) {
            try {
                const url = `${CONFIG.apiBase}/youtube/search?video=${videoId}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                const v = data.data || data.results || data;
                const videoData = Array.isArray(v) ? v[0] : v;

                if (videoData) {
                    state.currentVideoData = videoData;
                    const title = videoData.title || 'Vídeo';
                    const channel = videoData.channelTitle || videoData.channel || 'Canal';
                    const views = videoData.viewCount || videoData.views || 0;
                    const description = videoData.description || 'Sem descrição';
                    const subs = videoData.subscriberCount || 0;

                    document.getElementById('playerTitle').textContent = title;
                    document.getElementById('pTitle').textContent = title;
                    document.getElementById('pMeta').textContent = formatViews(views) + ' visualizações';
                    document.getElementById('pChannel').textContent = channel;
                    document.getElementById('pSubs').textContent = subs ? formatViews(subs) + ' inscritos' : '';
                    document.getElementById('pDesc').textContent = description;
                    document.getElementById('pAvatar').textContent = channel.charAt(0).toUpperCase();

                    state.currentChannelId = videoData.channelId || videoData.channel_id || '';

                    // Inicializar Video.js com o vídeo
                    setupPlayer(videoId);

                    // Atualizar botões
                    updatePlayerButtons(videoId);
                }
            } catch (err) {
                console.warn('Erro ao carregar detalhes:', err);
                // Fallback: carrega só o vídeo
                setupPlayer(videoId);
                showToast('⚠️ Detalhes indisponíveis');
            }
        }

        function setupPlayer(videoId) {
            const playerElement = document.getElementById('myPlayer');
            
            // Destruir player anterior se existir
            if (playerInstance) {
                playerInstance.dispose();
                playerInstance = null;
            }

            // URL do vídeo (usando o proxy do Invidious para stream)
            const videoUrl = `https://invidious.namazso.eu/api/v1/videos/${videoId}/dash/manifest.mpd`;
            // Fallback: usar embed do YouTube se o stream não funcionar
            // Mas como você pediu outro player, vamos tentar o stream

            // Criar novo player
            playerInstance = videojs('myPlayer', {
                controls: true,
                autoplay: true,
                preload: 'auto',
                fluid: true,
                html5: {
                    hls: {
                        enableLowInitialPlaylist: true,
                        smoothQualityChange: true,
                        overrideNative: true
                    }
                }
            });

            // Tentar carregar o vídeo
            // Como o Invidious pode bloquear CORS, vamos usar o embed do YouTube como fallback
            // Mas mantendo o Video.js como player
            
            // Opção 1: Stream direto (pode dar CORS)
            // playerInstance.src({ src: videoUrl, type: 'application/dash+xml' });
            
            // Opção 2: Usar o embed do YouTube dentro do Video.js (funciona sempre)
            // Isso ainda usa o YouTube, mas o player é o Video.js
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&showinfo=0`;
            
            // Criar um iframe dentro do player
            const wrapper = document.getElementById('playerWrapper');
            // Remover o video e colocar um iframe
            const oldVideo = document.getElementById('myPlayer');
            if (oldVideo) {
                oldVideo.style.display = 'none';
            }
            
            // Verificar se já existe um iframe
            let existingIframe = wrapper.querySelector('iframe');
            if (existingIframe) {
                wrapper.removeChild(existingIframe);
            }
            
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.allow = 'autoplay; encrypted-media; fullscreen';
            iframe.allowFullscreen = true;
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.minHeight = '300px';
            iframe.style.border = 'none';
            iframe.id = 'playerIframe';
            wrapper.appendChild(iframe);
            
            // Esconder o video.js (usamos iframe)
            const videoElement = document.getElementById('myPlayer');
            if (videoElement) videoElement.style.display = 'none';

            // Atualizar título
            document.getElementById('playerTitle').textContent = document.getElementById('pTitle').textContent || 'Vídeo';
        }

        function updatePlayerButtons(videoId) {
            const isLiked = state.viewed.includes(videoId);
            document.getElementById('pLikeBtn').textContent = isLiked ? '❤️ Curtido' : '👍 Curtir';
            document.getElementById('pLikeBtn').className = isLiked ? 'liked' : '';

            const isSaved = state.watchLater.includes(videoId);
            document.getElementById('pSaveBtn').textContent = isSaved ? '⏰ Salvo' : '⏰ Salvar';
            document.getElementById('pSaveBtn').className = isSaved ? 'saved' : '';

            const isDownloaded = state.downloaded.includes(videoId);
            document.getElementById('pDownloadBtn').textContent = isDownloaded ? '⬇️ Baixado' : '⬇️ Baixar';

            // Marcar como assistido
            if (!state.viewed.includes(videoId)) {
                state.viewed.push(videoId);
                const v = state.feed.find(f => f.id === videoId);
                if (v) v.watched = true;
                saveData();
                renderFeed();
            }
        }

        function closePlayer() {
            document.getElementById('playerOverlay').classList.remove('active');
            const iframe = document.getElementById('playerIframe');
            if (iframe) iframe.src = '';
            
            if (playerInstance) {
                playerInstance.dispose();
                playerInstance = null;
            }
            
            // Restaurar o video element
            const video = document.getElementById('myPlayer');
            if (video) video.style.display = 'block';
            
            state.currentVideoId = null;
        }

        function togglePlayerLike() {
            if (!state.user) { showToast('Faça login para curtir'); return; }
            const btn = document.getElementById('pLikeBtn');
            const isLiked = btn.classList.contains('liked');
            if (isLiked) {
                btn.classList.remove('liked');
                btn.textContent = '👍 Curtir';
                showToast('Curtida removida');
            } else {
                btn.classList.add('liked');
                btn.textContent = '❤️ Curtido';
                showToast('👍 Curtido!');
            }
        }

        function togglePlayerSave() {
            if (state.currentVideoId) toggleSave(state.currentVideoId);
            const isSaved = state.watchLater.includes(state.currentVideoId);
            const btn = document.getElementById('pSaveBtn');
            btn.textContent = isSaved ? '⏰ Salvo' : '⏰ Salvar';
            btn.className = isSaved ? 'saved' : '';
        }

        // ===== PESQUISA =====
        function searchVideos() {
            const q = document.getElementById('searchInput').value.trim();
            if (q) {
                loadFeed(q);
            }
        }

        // ===== UTILITÁRIOS =====
        function parseDuration(duration) {
            if (!duration) return 0;
            if (typeof duration === 'number') return duration;
            
            // Formato ISO 8601: PT1H2M3S ou PT2M3S
            if (duration.includes('PT')) {
                const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
                if (match) {
                    const h = parseInt(match[1]) || 0;
                    const m = parseInt(match[2]) || 0;
                    const s = parseInt(match[3]) || 0;
                    return h * 3600 + m * 60 + s;
                }
            }
            
            // Formato MM:SS
            if (duration.includes(':')) {
                const parts = duration.split(':').map(Number);
                if (parts.length === 2) return parts[0] * 60 + parts[1];
                if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
            }
            
            return parseInt(duration) || 0;
        }

        function formatDuration(seconds) {
            if (!seconds || seconds < 0) return '0:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            return `${m}:${String(s).padStart(2,'0')}`;
        }

        function formatViews(n) {
            if (!n) return '0';
            if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
            return String(n);
        }

        function formatDate(ts) {
            if (!ts) return 'data desconhecida';
            const d = new Date(ts * 1000);
            if (isNaN(d.getTime())) return 'data desconhecida';
            const now = Date.now();
            const diff = now - d.getTime();
            const days = Math.floor(diff / 86400000);
            if (days > 365) return Math.floor(days/365) + ' ano' + (days>365?'s':'');
            if (days > 30) return Math.floor(days/30) + ' mês' + (days>30?'es':'');
            if (days > 0) return days + ' dia' + (days>1?'s':'');
            return 'hoje';
        }

        function updateUI() {
            document.getElementById('feedCount').textContent = state.feed.length;
            document.getElementById('wlCount').textContent = state.watchLater.length;
            if (state.user) document.getElementById('loginBtn').textContent = state.user.name;
        }

        // ===== FECHAR PLAYER COM ESC =====
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

        // ===== INICIAR =====
        loadData();
        loadFeed();
    </script>
